        function submitListeningTest() {
            if (listeningSubmitted) { closeListening(); return; }

            let totalAnswered = 0;
            let totalQuestions = 0;
            listeningData.parts.forEach((part, i) => {
                totalQuestions += part.questions;
                const ans = listeningAnswers[i];
                if (part.type === 'drag-match') {
                    totalAnswered += ans.filter(a => a.name && a.action).length;
                } else if (part.type === 'fill-blank') {
                    totalAnswered += ans.filter(a => a.trim()).length;
                } else if (part.type === 'drag-match-letters') {
                    totalAnswered += ans.filter(a => a).length;
                } else if (part.type === 'multiple-choice-abc') {
                    totalAnswered += ans.filter(a => a >= 0).length;
                } else if (part.type === 'color-write') {
                    totalAnswered += ans.filter(a => a.item && a.answer).length;
                }
            });

            const doSubmit = () => {
                let score = 0;
                const partScores = [];
                listeningData.parts.forEach((part, i) => {
                    const ans = listeningAnswers[i];
                    let partScore = 0;
                    if (part.type === 'drag-match') {
                        part.answers.forEach((correct, j) => {
                            if (ans[j].name === correct.name && ans[j].action === correct.action) partScore++;
                        });
                    } else if (part.type === 'fill-blank') {
                        part.rows.forEach((row, j) => {
                            if (row.answer && ans[j].toLowerCase().trim() === row.answer.toLowerCase().trim()) partScore++;
                        });
                    } else if (part.type === 'drag-match-letters') {
                        part.answers.forEach((correct, j) => {
                            if (ans[j] === correct.answer) partScore++;
                        });
                    } else if (part.type === 'multiple-choice-abc') {
                        part.items.forEach((item, j) => {
                            if (ans[j] === item.answer) partScore++;
                        });
                    } else if (part.type === 'color-write') {
                        part.items.forEach((item, j) => {
                            const itemCorrect = ans[j].item === item.item;
                            const ansCorrect = item.answer && ans[j].answer.toLowerCase().trim() === item.answer.toLowerCase().trim();
                            if (itemCorrect && ansCorrect) partScore++;
                        });
                    }
                    score += partScore;
                    partScores.push({ title: part.title, score: partScore, total: part.questions });
                });

                const elapsed = Math.floor((Date.now() - listeningStartTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                const timeStr = `${mins} phút ${secs < 10 ? '0' : ''}${secs} giây`;
                const pct = Math.round((score / totalQuestions) * 100);

                const studentName = currentStudent ? currentStudent.name : 'Học sinh';
                const studentEng = currentStudent && currentStudent.englishName ? ` (${currentStudent.englishName})` : '';
                const studentClass = currentStudent ? currentStudent.class : '';

                let partRows = partScores.filter(p => p.total > 0).map(p => {
                    const ppct = Math.round((p.score / p.total) * 100);
                    const color = ppct >= 80 ? '#22c55e' : ppct >= 50 ? '#f59e0b' : '#ef4444';
                    return `<tr>
                        <td style="padding:8px 12px;text-align:left;font-weight:600">${p.title}</td>
                        <td style="padding:8px 12px;text-align:center">${p.score} / ${p.total}</td>
                        <td style="padding:8px 12px;text-align:center"><span style="background:${color};color:white;padding:2px 10px;border-radius:8px;font-weight:700;font-size:20px">${ppct}%</span></td>
                    </tr>`;
                }).join('');

                const listeningShieldsCount = shieldThresholds[currentMaterialId] ? getShields(currentMaterialId, 'listening', score) : null;
                const resultHtml = buildResultCard({
                    testTitle: listeningData.title,
                    skillLabel: 'Listening',
                    partScores,
                    totalScore: score,
                    totalMax: totalQuestions,
                    pct,
                    shields: listeningShieldsCount,
                    studentName, studentEng, studentClass, timeStr,
                    reviewBtnId: 'btn-review-result',
                    saveBtnId: 'btn-save-result'
                });

                listeningSubmitted = true;

                if (fullTestMode) {
                    fullTestListeningScore = { score, totalQuestions, partScores, timeStr, pct };
                    Swal.fire({
                        title: 'Hoàn thành phần Listening!',
                        html: `<p style="font-size:20px">Điểm Listening: <b>${score}/${totalQuestions}</b> (${pct}%)</p><p style="font-size:20px;color:#64748b;margin-top:8px">Bây giờ chuyển sang phần <b>Reading</b>...</p>`,
                        icon: 'success',
                        confirmButtonText: 'Bắt đầu Reading',
                        confirmButtonColor: '#20a1a0',
                        allowOutsideClick: false
                    }).then(() => {
                        doCloseListening();
                        openReadingTest(fullTestReadingData, fullTestReadingTitle);
                    });
                    return;
                }

                listeningCanReview = isTeacherMode || pct >= 80;
                let listeningReviewClicked = false;
                Swal.fire({
                    title: 'Nộp bài thành công!',
                    html: resultHtml,
                    icon: 'success',
                    showConfirmButton: false,
                    showCloseButton: true,
                    width: '90%',
                    customClass: { popup: 'swal-result-popup' },
                    didOpen: () => {
                        const reviewBtn = document.getElementById('btn-review-result');
                        if (!reviewBtn.disabled) {
                            reviewBtn.addEventListener('click', () => {
                                listeningReviewClicked = true;
                                Swal.close();
                                const btn = document.getElementById('btn-submit-listening');
                                btn.innerHTML = '<i class="fa-solid fa-door-open mr-2"></i> Quay lại';
                                btn.className = btn.className.replace('bg-turtle-500', 'bg-slate-600').replace('hover:bg-turtle-600', 'hover:bg-slate-700');
                                activePart = 0;
                                renderListeningTabs();
                                renderListeningPart();
                            });
                        }
                        document.getElementById('btn-save-result').addEventListener('click', async () => {
                            const card = document.getElementById('result-card');
                            const btns = card.querySelector('div[style*="display:flex;gap:12px;justify-content:center;margin-top"]');
                            if (btns) btns.style.display = 'none';
                            try {
                                const canvas = await html2canvas(card, { backgroundColor: '#ffffff', scale: 2 });
                                const link = document.createElement('a');
                                const safeName = (currentStudent ? currentStudent.englishName || currentStudent.name : 'result').replace(/\s+/g, '_');
                                link.download = `KetQua_${safeName}_${new Date().toISOString().slice(0,10)}.png`;
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                            } catch(e) { console.error(e); }
                            btns.style.display = 'flex';
                        });
                    },
                    didClose: () => {
                        if (!listeningReviewClicked && !listeningCanReview) doCloseListening();
                    }
                });
            };

            if (totalAnswered < totalQuestions) {
                Swal.fire({
                    title: 'Khoan đã!',
                    html: `Bạn còn <b>${totalQuestions - totalAnswered} câu</b> chưa trả lời.<br>Nộp bài lúc này?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#20a1a0',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Nộp luôn',
                    cancelButtonText: 'Làm tiếp'
                }).then(r => { if (r.isConfirmed) doSubmit(); });
            } else {
                Swal.fire({
                    title: 'Xác nhận nộp bài',
                    text: 'Bạn đã hoàn thành. Nộp bài nhé?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#20a1a0',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Đồng ý nộp',
                    cancelButtonText: 'Kiểm tra lại'
                }).then(r => { if (r.isConfirmed) doSubmit(); });
            }
        }

        let activeHighlightColor = null;

        function toggleHighlight(color) {
            if (activeHighlightColor === color) {
                activeHighlightColor = null;
            } else {
                activeHighlightColor = color;
            }
            document.querySelectorAll('.hl-btn').forEach(btn => btn.classList.remove('hl-active'));
            if (activeHighlightColor) {
                document.querySelectorAll(`[id^="hl-${activeHighlightColor}"]`).forEach(btn => btn.classList.add('hl-active'));
            }
        }

        function applyHighlight() {
            if (!activeHighlightColor) return;
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            const container = range.commonAncestorContainer;
            const contentEl = document.getElementById('listening-content') || document.getElementById('reading-content');
            const inListening = document.getElementById('listening-content')?.contains(container);
            const inReading = document.getElementById('reading-content')?.contains(container);
            if (!inListening && !inReading) return;
            if (container.closest && (container.closest('input') || container.closest('textarea'))) return;
            const mark = document.createElement('mark');
            mark.className = `hl-${activeHighlightColor}`;
            try { range.surroundContents(mark); } catch(e) {}
            sel.removeAllRanges();
        }

        function removeHighlight() {
            activeHighlightColor = null;
            document.querySelectorAll('.hl-btn').forEach(btn => btn.classList.remove('hl-active'));
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            const fragment = range.cloneContents();
            const marks = fragment.querySelectorAll('mark.hl-yellow, mark.hl-green');
            if (marks.length === 0) {
                const parent = range.startContainer.parentElement;
                if (parent && parent.tagName === 'MARK' && (parent.classList.contains('hl-yellow') || parent.classList.contains('hl-green'))) {
                    parent.replaceWith(...parent.childNodes);
                }
            } else {
                const container = range.commonAncestorContainer.nodeType === 3 ? range.commonAncestorContainer.parentElement : range.commonAncestorContainer;
                container.querySelectorAll('mark.hl-yellow, mark.hl-green').forEach(m => {
                    if (sel.containsNode(m, true)) m.replaceWith(...m.childNodes);
                });
            }
            sel.removeAllRanges();
        }

        document.addEventListener('mouseup', () => { setTimeout(applyHighlight, 10); });
        document.addEventListener('touchend', () => { setTimeout(applyHighlight, 10); });

        function closeListening() {
            if (!listeningSubmitted) {
                Swal.fire({
                    title: 'Thoát bài tập?',
                    text: 'Tiến độ sẽ không được lưu.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Thoát',
                    cancelButtonText: 'Ở lại'
                }).then(r => {
                    if (r.isConfirmed) doCloseListening();
                });
            } else {
                doCloseListening();
            }
        }

        function doCloseListening() {
            document.getElementById('view-listening').classList.remove('active');
            document.getElementById('view-detail').classList.add('active');
            if (isLoggedIn) document.getElementById('main-nav').classList.remove('hidden');
            const btn = document.getElementById('btn-submit-listening');
            btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài';
            btn.className = btn.className.replace('bg-slate-600', 'bg-turtle-500').replace('hover:bg-slate-700', 'hover:bg-turtle-600');
        }

        // ============================================================
        // READING TEST
        // ============================================================
        let readingData = null;
        let readingAnswers = {};
        let activeReadingPart = 0;
        let readingSubmitted = false;
        let readingCanReview = false;
        let readingStartTime = null;

        function openReadingTest(data, title) {
            readingData = data;
            readingSubmitted = false;
            readingCanReview = false;
            readingStartTime = Date.now();
            readingAnswers = {};
            window._writingScores = null;

            data.parts.forEach((part, i) => {
                if (part.type === 'definition-match') {
                    readingAnswers[i] = part.items.map(() => '');
                } else if (part.type === 'conversation-choice') {
                    readingAnswers[i] = part.items.map(() => -1);
                } else if (part.type === 'story-fill') {
                    readingAnswers[i] = { blanks: part.items.map(() => ''), title: -1 };
                } else if (part.type === 'grammar-cloze') {
                    readingAnswers[i] = part.items.map(() => -1);
                } else if (part.type === 'story-write') {
                    const total = part.storySegments.reduce((s, seg) => s + (seg.questions ? seg.questions.length : 0), 0);
                    readingAnswers[i] = Array(total).fill('');
                } else if (part.type === 'picture-write') {
                    readingAnswers[i] = part.items.map(() => '');
                } else if (part.type === 'sentence-transform' || part.type === 'error-correction') {
                    readingAnswers[i] = part.items.map(() => '');
                } else if (part.type === 'fill-blank-reading') {
                    readingAnswers[i] = part.items.map(item => {
                        const blankCount = (item.sentence.match(/\.\.\.\.\.\.\.\.\.\./g) || []).length;
                        return blankCount > 1 ? Array(blankCount).fill('') : '';
                    });
                } else if (part.type === 'word-box-fill') {
                    readingAnswers[i] = part.items.map(() => '');
                } else if (part.type === 'reading-match-persons') {
                    readingAnswers[i] = part.items.map(() => '');
                } else if (part.type === 'picture-story-write') {
                    readingAnswers[i] = [''];
                } else if (part.type === 'free-writing') {
                    readingAnswers[i] = part.sampleAnswers ? part.sampleAnswers.map(() => '') : [];
                } else if (part.type === 'multiple-choice-abc') {
                    readingAnswers[i] = part.items.map(() => -1);
                } else if (part.type === 'fill-blank') {
                    readingAnswers[i] = part.rows.map(() => '');
                }
            });

            activeReadingPart = 0;

            document.getElementById('reading-title').textContent = title || data.title;
            document.getElementById('view-detail').classList.remove('active');
            document.getElementById('main-nav').classList.add('hidden');
            document.getElementById('view-reading').classList.add('active');

            const readingInfoEl = document.getElementById('reading-student-info');
            if (currentStudent) {
                const eng = currentStudent.englishName ? ` (${currentStudent.englishName})` : '';
                readingInfoEl.innerHTML = `<i class="fa-solid fa-user-check text-turtle-500"></i>
                    <span class="font-semibold text-slate-700">${currentStudent.name}${eng}</span>
                    <span class="text-slate-400">|</span>
                    <span class="text-slate-500">${currentStudent.class}</span>`;
            } else {
                readingInfoEl.innerHTML = '';
            }

            renderReadingTabs();
            renderReadingPart();
        }

        function renderReadingTabs() {
            const tabs = document.getElementById('reading-tabs');
            tabs.innerHTML = '';
            readingData.parts.forEach((part, i) => {
                const isActive = activeReadingPart === i;
                const tab = document.createElement('button');
                tab.className = `part-tab px-4 py-2 rounded-xl font-bold ${isActive ? 'active shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                const titleCounts = {};
                readingData.parts.forEach(p => { titleCounts[p.title] = (titleCounts[p.title] || 0) + 1; });
                const sameTitle = readingData.parts.filter((p, idx) => idx <= i && p.title === part.title);
                tab.textContent = titleCounts[part.title] > 1 ? `${part.title} (${sameTitle.length})` : part.title;
                tab.onclick = () => { activeReadingPart = i; renderReadingTabs(); renderReadingPart(); };
                tabs.appendChild(tab);
            });
            updateReadingNav();
        }
        function updateReadingNav() {
            const backBtn = document.getElementById('btn-back-reading');
            const nextBtn = document.getElementById('btn-next-reading');
            if (backBtn) backBtn.style.visibility = activeReadingPart === 0 ? 'hidden' : 'visible';
            if (nextBtn) nextBtn.style.visibility = activeReadingPart >= readingData.parts.length - 1 ? 'hidden' : 'visible';
        }
        function navReadingPart(dir) {
            const newIdx = activeReadingPart + dir;
            if (newIdx >= 0 && newIdx < readingData.parts.length) {
                activeReadingPart = newIdx; renderReadingTabs(); renderReadingPart();
            }
        }

        function renderReadingPart() {
            const part = readingData.parts[activeReadingPart];
            if (part.type === 'definition-match') renderDefinitionMatch(part);
            else if (part.type === 'conversation-choice') renderConversationChoice(part);
            else if (part.type === 'story-fill') renderStoryFill(part);
            else if (part.type === 'grammar-cloze') renderGrammarCloze(part);
            else if (part.type === 'story-write') renderStoryWrite(part);
            else if (part.type === 'picture-write') renderPictureWrite(part);
            else if (part.type === 'sentence-transform') renderSentenceTransform(part);
            else if (part.type === 'error-correction') renderErrorCorrection(part);
            else if (part.type === 'fill-blank-reading') renderFillBlankReading(part);
            else if (part.type === 'word-box-fill') renderWordBoxFill(part);
            else if (part.type === 'reading-match-persons') renderReadingMatchPersons(part);
            else if (part.type === 'picture-story-write') renderPictureStoryWrite(part);
            else if (part.type === 'free-writing') renderFreeWriting(part);
            else if (part.type === 'multiple-choice-abc') renderWorkbookListening(part);
            else if (part.type === 'fill-blank') renderWorkbookFillBlank(part);
        }

        // --- Part 1: Definition Match ---
        function renderDefinitionMatch(part) {
            const content = document.getElementById('reading-content');
            const answers = readingAnswers[activeReadingPart];

            let html = `<div class="w-full">
                <p class="text-slate-500 italic mb-4 text-sm"><i class="fa-solid fa-info-circle mr-1"></i> ${part.instructions}</p>
                <div class="resp-row">
                    <div class="resp-col shrink-0" style="width:35%">
                        <div class="bg-white rounded-2xl p-4 shadow-sm border sticky top-0">
                            <h4 class="font-bold text-slate-600 mb-3"><i class="fa-solid fa-list mr-1 text-indigo-500"></i><i class="fa-solid fa-spell-check ml-1 mr-1 text-indigo-500"></i> Words</h4>
                            <div class="flex flex-col gap-2">`;
            part.wordBank.forEach(w => {
                const isExample = w === part.example.answer;
                const imgSrc = part.wordImages && part.wordImages[w] ? part.wordImages[w] : '';
                html += `<div class="flex items-center gap-3 px-3 py-2 ${isExample ? 'bg-green-50 border border-green-200 text-green-700 opacity-50' : 'bg-indigo-50 border border-indigo-200 text-indigo-700'} rounded-xl font-medium" style="font-size:20px;">
                    ${imgSrc ? `<img src="${imgSrc}" class="w-32 h-24 object-contain rounded">` : ''}
                    <span>${w}</span>
                </div>`;
            });
            html += `</div></div></div>
                    <div style="width:65%" class="resp-col flex flex-col gap-3">`;

            // Example
            html += `<div class="bg-green-50 rounded-2xl p-4 border border-green-200">
                <div class="flex items-center gap-2 mb-2"><span class="bg-green-500 text-white px-3 py-1 rounded-lg font-bold text-sm">Example</span></div>
                <p class="text-slate-700 mb-2" style="font-size:20px;">${part.example.definition}</p>
                <span class="font-bold text-green-700 border-b-2 border-green-400 px-2" style="font-size:20px;">${part.example.answer}</span>
            </div>`;

            // Questions
            part.items.forEach((item, i) => {
                let answerHtml;
                if (readingCanReview) {
                    const isCorrect = answers[i].toLowerCase().trim() === item.answer.toLowerCase().trim();
                    answerHtml = `<input type="text" value="${answers[i]}" readonly class="w-full px-3 py-2 border-2 rounded-xl font-bold ${isCorrect ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-400 bg-red-50 text-red-700'}" style="font-size:20px;">`;
                    if (!isCorrect && item.answer) answerHtml += `<span class="text-green-600 font-bold text-sm mt-1 block"><i class="fa-solid fa-arrow-right mr-1"></i>${item.answer}</span>`;
                } else {
                    answerHtml = `<input type="text" value="${answers[i]}" ${readingSubmitted ? 'readonly' : ''} placeholder="Type your answer..." ${readingSubmitted ? '' : `oninput="readingAnswers[${activeReadingPart}][${i}]=this.value"`} class="w-full px-3 py-2 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-turtle-400 font-medium" style="font-size:20px;">`;
                }
                html += `<div class="bg-white rounded-2xl p-4 border shadow-sm">
                    <p class="text-slate-700 mb-2" style="font-size:20px;"><span class="font-bold text-turtle-600 mr-2">${item.num}.</span>${item.definition}</p>
                    ${answerHtml}
                </div>`;
            });

            html += `</div></div></div>`;
            content.innerHTML = html;
        }

        // --- Part 2: Conversation Choice ---
        function selectConvChoice(qIdx, optIdx) {
            if (readingSubmitted) return;
            readingAnswers[activeReadingPart][qIdx] = optIdx;
            renderConversationChoice(readingData.parts[activeReadingPart]);
        }

        function renderConversationChoice(part) {
            const content = document.getElementById('reading-content');
            const answers = readingAnswers[activeReadingPart];
            const letters = ['A', 'B', 'C'];

            let html = `<div class="max-w-2xl mx-auto">
                <p class="text-slate-500 italic mb-4 text-sm"><i class="fa-solid fa-info-circle mr-1"></i> ${part.instructions}</p>
                <div class="bg-blue-50 rounded-2xl p-4 border border-blue-200 mb-4">
                    <p class="text-blue-800 font-medium" style="font-size:20px;"><i class="fa-solid fa-comment-dots mr-2 text-blue-500"></i>${part.context}</p>
                </div>`;

            // Example
            html += `<div class="bg-green-50 rounded-2xl p-4 border border-green-200 mb-3">
                <div class="flex items-center gap-2 mb-2"><span class="bg-green-500 text-white px-3 py-1 rounded-lg font-bold text-sm">Example</span></div>
                <p class="font-bold text-slate-800 mb-3" style="font-size:20px;"><span class="text-blue-600">${part.example.speaker}:</span> ${part.example.question}</p>
                <div class="space-y-2">`;
            part.example.options.forEach((opt, j) => {
                const isAnswer = j === part.example.answer;
                html += `<div class="p-3 rounded-xl font-medium ${isAnswer ? 'bg-green-500 text-white' : 'bg-white border border-slate-200 text-slate-400'}" style="font-size:20px;">
                    <span class="font-bold">${letters[j]}.</span> ${opt}</div>`;
            });
            html += `</div></div>`;

            // Questions
            part.items.forEach((item, i) => {
                html += `<div class="bg-white rounded-2xl p-4 border shadow-sm mb-3">
                    <p class="font-bold text-slate-800 mb-3" style="font-size:20px;"><span class="text-turtle-600 mr-2">${item.num}.</span><span class="text-blue-600">${item.speaker}:</span> ${item.question}</p>
                    <div class="space-y-2">`;
                item.options.forEach((opt, j) => {
                    let btnClass = 'p-3 rounded-xl font-medium transition-all ';
                    if (readingCanReview) {
                        if (j === item.answer) btnClass += 'bg-green-500 text-white';
                        else if (answers[i] === j && j !== item.answer) btnClass += 'bg-red-400 text-white';
                        else btnClass += 'bg-slate-50 border border-slate-200 text-slate-400';
                    } else {
                        if (answers[i] === j) btnClass += 'bg-turtle-500 text-white shadow-md';
                        else btnClass += 'bg-slate-50 border border-slate-200 text-slate-600 hover:border-turtle-300 hover:bg-turtle-50 cursor-pointer';
                    }
                    html += `<div class="${btnClass}" style="font-size:20px;" onclick="selectConvChoice(${i},${j})">
                        <span class="font-bold">${letters[j]}.</span> ${opt}</div>`;
                });
                html += `</div></div>`;
            });

            html += `</div>`;
            content.innerHTML = html;
        }

        // --- Part 3: Story Fill ---
        function selectStoryTitle(optIdx) {
            if (readingSubmitted) return;
            readingAnswers[activeReadingPart].title = optIdx;
            renderStoryFill(readingData.parts[activeReadingPart]);
        }

        function renderStoryFill(part) {
            const content = document.getElementById('reading-content');
            const answers = readingAnswers[activeReadingPart];

            let html = `<div class="w-full">
                <p class="text-slate-500 italic mb-4 text-sm"><i class="fa-solid fa-info-circle mr-1"></i> ${part.instructions}</p>
                <div class="resp-row">
                    <div class="resp-col shrink-0" style="width:30%">
                        <div class="bg-white rounded-2xl p-4 shadow-sm border sticky top-0">
                            <h4 class="font-bold text-slate-600 mb-3"><i class="fa-solid fa-list mr-1 text-indigo-500"></i><i class="fa-solid fa-spell-check ml-1 mr-1 text-indigo-500"></i> Word box</h4>
                            <div class="flex flex-col gap-2">
                                <div class="flex items-center gap-3 px-3 py-2 bg-green-50 border border-green-200 rounded-xl font-medium text-green-700 opacity-50" style="font-size:20px;">
                    ${part.wordImages && part.wordImages[part.example.word] ? `<img src="${part.wordImages[part.example.word]}" class="w-32 h-24 object-contain rounded">` : ''}
                    <span>${part.example.word}</span>
                </div>`;
            part.wordBank.forEach(w => {
                const imgSrc = part.wordImages && part.wordImages[w] ? part.wordImages[w] : '';
                html += `<div class="flex items-center gap-3 px-3 py-2 bg-indigo-50 border border-indigo-200 rounded-xl font-medium text-indigo-700" style="font-size:20px;">
                    ${imgSrc ? `<img src="${imgSrc}" class="w-32 h-24 object-contain rounded">` : ''}
                    <span>${w}</span>
                </div>`;
            });
            html += `</div></div></div>
                    <div style="width:70%" class="resp-col flex flex-col gap-4">`;

            // Story with blanks (text inputs)

        function downloadWritingDoc(part, answers) {
            const studentName = currentStudent ? currentStudent.name : 'Unknown';

            const dateStr = new Date().toLocaleDateString('vi-VN');

            let questionsHtml = '';
            let studentAnswersHtml = '';

            if (part.type === 'picture-story-write') {
                questionsHtml = `<p><b>Instructions:</b> ${part.instructions}</p>`;
                if (part.storyImage) questionsHtml += `<p><i>(See attached image: ${part.storyImage})</i></p>`;
                studentAnswersHtml = `<p>${(answers[0] || '').replace(/\n/g, '<br>')}</p>`;
                const wc = (answers[0] || '').split(/\s+/).filter(w => w).length;
                studentAnswersHtml += `<p><i>Word count: ${wc}</i></p>`;
            } else if (part.type === 'free-writing') {
                questionsHtml = `<p><b>Instructions:</b> ${part.instructions}</p>`;
                const items = part.sampleAnswers || [];
                items.forEach((item, i) => {
                    questionsHtml += `<p><b>${item.num}.</b> ${item.question}</p>`;
                    studentAnswersHtml += `<p><b>${item.num}.</b> ${answers[i] || '<i>(No answer)</i>'}</p>`;
                });
            }

            const docContent = `
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><style>
body { font-family: 'Times New Roman', serif; font-size: 13pt; margin: 2cm; }
h1 { font-size: 16pt; color: #333; border-bottom: 2px solid #00AFA9; padding-bottom: 8px; }
h2 { font-size: 14pt; color: #555; margin-top: 20px; }
.info { background: #f5f5f5; padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; }
.info p { margin: 3px 0; }
.section { margin-top: 15px; padding: 12px 15px; border: 1px solid #ddd; border-radius: 5px; }

<body>
<h1>${part.title || 'Writing Exercise'}</h1>

<p>_______________________________________________</p>
<p>_______________________________________________</p>
<p>_______________________________________________</p>
<br>
<p><b>Score:</b> _______ / _______</p>
</body></html>`;

            const blob = new Blob([docContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safeName = studentName.replace(/\s+/g, '_');
            a.href = url;
            a.download = `Writing_${safeName}_${dateStr.replace(/\//g, '-')}.doc`;
            a.click();
            URL.revokeObjectURL(url);

                        if (j === item.answer) cls += 'bg-green-500 text-white';
                        else if (answers[i] === j && j !== item.answer) cls += 'bg-red-400 text-white';
                        else cls += 'bg-slate-50 border border-slate-200 text-slate-400';
                    } else {
                        if (answers[i] === j) cls += 'bg-turtle-500 text-white shadow-md';
                        else cls += 'bg-slate-50 border border-slate-200 text-slate-600 hover:border-turtle-300 hover:bg-turtle-50';
                    }
                    html += `<div class="${cls}" onclick="if(!readingSubmitted){readingAnswers[${activeReadingPart}][${i}]=${j};renderReadingPart()}"><span class="font-bold">${letters[j]}</span>. ${opt}</div>`;
                });
                html += `</div></div>`;
            });
            if (readingCanReview && part.script && part.script.length > 0) {
                html += `<div class="mt-4 bg-amber-50 border border-amber-200 rounded-2xl p-4">
                    <h4 class="font-bold text-amber-700 mb-3" style="font-size:20px"><i class="fa-solid fa-scroll mr-1"></i> Audio Script</h4>
                    <div class="space-y-1">`;
                part.script.forEach(line => {
                    html += `<div style="font-size:20px"><span class="font-bold text-slate-800">${line.speaker}:</span> <span class="text-slate-700">${line.text}</span></div>`;
                });
                html += `</div></div>`;
            }
            if (hasPassage) html += `</div></div>`;
            html += `</div>`;
            content.innerHTML = html;
        }

        function renderWorkbookFillBlank(part) {
            const content = document.getElementById('reading-content');
            const answers = readingAnswers[activeReadingPart];
            let formHtml = `
                <div class="bg-white rounded-2xl shadow-sm border p-6 sm:p-8">
                    <h3 class="text-2xl font-bold text-slate-800 text-center mb-6 pb-4 border-b">${part.formTitle}</h3>
                    <div class="space-y-5">
                        <div class="flex items-center gap-3 bg-green-50 p-4 rounded-xl border border-green-200" style="font-size:20px;">
                            <span class="font-bold text-green-600 w-8 shrink-0">Ex</span>
                            <span class="text-slate-700 font-medium shrink-0">${part.example.label}</span>
                            ${part.example.prefix ? `<span class="text-green-700 shrink-0">${part.example.prefix}</span>` : ''}
                            <span class="font-bold text-green-700 border-b-2 border-green-400 px-2">${part.example.answer}</span>
                        </div>`;
            part.rows.forEach((row, i) => {
                let inputHtml;
                const altAnswers = row.altAnswers || [];
                const allCorrect = [row.answer, ...altAnswers].map(a => a.toLowerCase().trim());
                if (readingCanReview) {
                    const isCorrect = allCorrect.includes((answers[i] || '').toLowerCase().trim());
                    inputHtml = `<input type="text" value="${answers[i] || ''}" readonly class="min-w-0 flex-1 px-3 py-2 border-2 rounded-xl font-bold ${isCorrect ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-400 bg-red-50 text-red-700'}" style="font-size:20px;">`;
                    if (!isCorrect) {
                        inputHtml += `<span class="text-green-600 font-bold text-sm ml-2 shrink-0"><i class="fa-solid fa-arrow-right mr-1"></i>${row.answer}</span>`;
                    }
                } else {
                    inputHtml = `<input type="text" value="${answers[i] || ''}" ${readingSubmitted ? 'readonly' : ''} placeholder="..." ${readingSubmitted ? '' : `oninput="readingAnswers[${activeReadingPart}][${i}]=this.value"`} class="min-w-0 flex-1 px-3 py-2 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-turtle-400 font-medium" style="font-size:20px;">`;
                }
                formHtml += `
                        <div class="flex items-center gap-3 p-4 rounded-xl border ${readingSubmitted ? '' : 'hover:bg-slate-50'}" style="font-size:20px;">
                            <span class="font-bold text-turtle-600 w-8 shrink-0">${row.num}</span>
                            <span class="text-slate-700 font-medium shrink-0">${row.label}</span>
                            ${row.prefix ? `<span class="text-slate-500 shrink-0">${row.prefix}</span>` : ''}
                            ${inputHtml}
                        </div>`;
            });
            formHtml += `</div></div>`;
            let html = `<div class="max-w-2xl mx-auto">
                <p class="text-slate-500 italic mb-4 text-sm"><i class="fa-solid fa-info-circle mr-1"></i> ${part.instructions}</p>`;
            if (part.audio) {
                html += `<div class="mb-4 bg-slate-50 rounded-xl p-3 border">
                    <audio controls class="w-full" src="${part.audio}"></audio>
                </div>`;
            }
            html += formHtml;
            if (readingCanReview && part.script && part.script.length > 0) {
                html += `<div class="mt-4 bg-amber-50 border border-amber-200 rounded-2xl p-4">
                    <h4 class="font-bold text-amber-700 mb-3" style="font-size:20px"><i class="fa-solid fa-scroll mr-1"></i> Audio Script</h4>
                    <div class="space-y-1">`;
                part.script.forEach(line => {
                    html += `<div style="font-size:20px"><span class="font-bold text-slate-800">${line.speaker}:</span> <span class="text-slate-700">${line.text}</span></div>`;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
            content.innerHTML = html;
        }

        // --- Submit & Score ---
        function submitReadingTest() {
            if (readingSubmitted) { closeReading(); return; }

            const totalQ = readingData.parts.reduce((s, p) => s + p.questions, 0);
            let answeredCount = 0;
            readingData.parts.forEach((part, i) => {
                const ans = readingAnswers[i];
                if (part.type === 'definition-match') answeredCount += ans.filter(a => a.trim()).length;
                else if (part.type === 'conversation-choice') answeredCount += ans.filter(a => a >= 0).length;
                else if (part.type === 'story-fill') { answeredCount += ans.blanks.filter(a => a.trim()).length; if (ans.title >= 0) answeredCount++; }
                else if (part.type === 'grammar-cloze') answeredCount += ans.filter(a => a >= 0).length;
                else if (part.type === 'story-write') answeredCount += ans.filter(a => a.trim()).length;
                else if (part.type === 'picture-write') answeredCount += ans.filter(a => a.trim()).length;
                else if (part.type === 'fill-blank-reading') {
                    ans.forEach(a => { if (Array.isArray(a)) { answeredCount += a.filter(v => v.trim()).length; } else if (a.trim()) answeredCount++; });
                }
                else if (part.type === 'sentence-transform' || part.type === 'error-correction' || part.type === 'word-box-fill' || part.type === 'reading-match-persons' || part.type === 'picture-story-write' || part.type === 'free-writing') answeredCount += ans.filter(a => typeof a === 'string' && a.trim()).length;
                else if (part.type === 'multiple-choice-abc') answeredCount += ans.filter(a => a >= 0).length;
                else if (part.type === 'fill-blank') answeredCount += ans.filter(a => typeof a === 'string' && a.trim()).length;
            });

            Swal.fire({
                title: 'Nộp bài?',
                html: `Bạn đã trả lời <b>${answeredCount}/${totalQ}</b> câu hỏi.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '<i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài',
                cancelButtonText: 'Quay lại',
                confirmButtonColor: '#20a1a0'
            }).then(r => { if (r.isConfirmed) doSubmitReading(); });
        }

        function doSubmitReading() {
            readingSubmitted = true;
            const elapsed = Math.floor((Date.now() - readingStartTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            const timeStr = `${mins} phút ${secs} giây`;

            let partScores = [];
            readingData.parts.forEach((part, i) => {
                const ans = readingAnswers[i];
                let correct = 0;
                if (part.type === 'definition-match') {
                    part.items.forEach((item, j) => { if (ans[j].toLowerCase().trim() === item.answer.toLowerCase().trim()) correct++; });
                } else if (part.type === 'conversation-choice') {
                    part.items.forEach((item, j) => { if (ans[j] === item.answer) correct++; });
                } else if (part.type === 'story-fill') {
                    part.items.forEach((item, j) => { if (ans.blanks[j].toLowerCase().trim() === item.answer.toLowerCase().trim()) correct++; });
                    if (part.titleQuestion && ans.title === part.titleQuestion.answer) correct++;
                } else if (part.type === 'grammar-cloze') {
                    part.items.forEach((item, j) => { if (ans[j] === item.answer) correct++; });
                } else if (part.type === 'story-write') {
                    let qIdx = 0;
                    part.storySegments.forEach(seg => {
                        if (seg.questions) seg.questions.forEach(q => {
                            if (ans[qIdx].toLowerCase().trim() === q.answer.toLowerCase().trim()) correct++;
                            qIdx++;
                        });
                    });
                } else if (part.type === 'picture-write') {
                    part.items.forEach((item, j) => {
                        if (item.type === 'free') return;
                        const pts = item.points || 1;
                        if (ans[j].toLowerCase().trim() === item.answer.toLowerCase().trim()) correct += pts;
                    });
                } else if (part.type === 'sentence-transform' || part.type === 'error-correction') {
                    part.items.forEach((item, j) => {
                        const allAnswers = [item.answer, ...(item.altAnswers || [])];
                        if (allAnswers.some(a => ans[j].toLowerCase().trim() === a.toLowerCase().trim())) correct++;
                    });
                } else if (part.type === 'fill-blank-reading') {
                    part.items.forEach((item, j) => {
                        const itemAnswers = item.answers || [item.answer];
                        if (Array.isArray(ans[j])) {
                            ans[j].forEach((val, bi) => {
                                const cv = (itemAnswers[bi] || '');
                                const alts = cv.split('/').map(a => a.toLowerCase().trim());
                                if (alts.includes(val.toLowerCase().trim())) correct++;
                            });
                        } else {
                            if (itemAnswers.some(a => a.split('/').map(x=>x.toLowerCase().trim()).includes(ans[j].toLowerCase().trim()))) correct++;
                        }
                    });
                } else if (part.type === 'word-box-fill') {
                    part.items.forEach((item, j) => { if (ans[j].toLowerCase().trim() === item.answer.toLowerCase().trim()) correct++; });
                } else if (part.type === 'reading-match-persons') {
                    part.items.forEach((item, j) => { if (ans[j].toUpperCase().trim() === item.answer.toUpperCase().trim()) correct++; });
                } else if (part.type === 'picture-story-write') {
                    correct = 0;
                } else if (part.type === 'free-writing') {
                    correct = 0;
                } else if (part.type === 'multiple-choice-abc') {
                    part.items.forEach((item, j) => { if (ans[j] === item.answer) correct++; });
                } else if (part.type === 'fill-blank') {
                    part.rows.forEach((row, j) => {
                        const allCorrect = [row.answer, ...(row.altAnswers || [])].map(a => a.toLowerCase().trim());
                        if (allCorrect.includes((ans[j] || '').toLowerCase().trim())) correct++;
                    });
                }
                const nonFreeQ = part.type === 'picture-write' ? part.items.filter(it => it.type !== 'free').reduce((s, it) => s + (it.points || 1), 0) : (part.type === 'picture-story-write' || part.type === 'free-writing') ? 0 : part.type === 'fill-blank-reading' ? part.items.reduce((s, item) => { const bc = (item.sentence.match(/\.\.\.\.\.\.\.\.\.\./g) || []).length; return s + (bc > 1 ? bc : 1); }, 0) : part.questions;
                partScores.push({ title: part.title, correct, total: nonFreeQ });
            });

            const totalCorrect = partScores.reduce((s, p) => s + p.correct, 0);
            const totalQuestions = partScores.reduce((s, p) => s + p.total, 0);
            const pct = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;

            const totalColor = pct >= 80 ? '#22c55e' : pct >= 50 ? '#eab308' : '#ef4444';
            const readingShields = getShields(currentMaterialId, 'reading', totalCorrect);

            const studentName = currentStudent ? currentStudent.name : 'Học sinh';
            const studentEng = currentStudent && currentStudent.englishName ? ` (${currentStudent.englishName})` : '';
            const studentClass = currentStudent ? currentStudent.class : '';

            if (fullTestMode && fullTestListeningScore) {
                const ls = fullTestListeningScore;
                const listeningShieldsCount = shieldThresholds[currentMaterialId] ? getShields(currentMaterialId, 'listening', ls.score) : null;
                const readingShieldsCount = shieldThresholds[currentMaterialId] ? readingShields : null;
                const grandTotal = ls.score + totalCorrect;
                const grandMax = ls.totalQuestions + totalQuestions;
                const grandPct = Math.round((grandTotal / grandMax) * 100);

                const allParts = [
                    ...ls.partScores.map(p => ({ title: `<i class="fa-solid fa-headphones" style="margin-right:4px;color:#0891b2"></i>${p.title}`, correct: p.score, total: p.total })),
                    ...partScores.map(p => ({ title: `<i class="fa-solid fa-book-open" style="margin-right:4px;color:#7c3aed"></i>${p.title}`, correct: p.correct, total: p.total }))
                ];

                const resultHtml = buildResultCard({
                    testTitle: readingData.title.replace(/ - .*/, ''),
                    skillLabel: 'Full Test',
                    partScores: allParts,
                    totalScore: grandTotal,
                    totalMax: grandMax,
                    pct: grandPct,
                    shields: null,
                    studentName, studentEng, studentClass, timeStr,
                    reviewBtnId: 'btn-review-reading',
                    saveBtnId: 'btn-save-reading'
                }).replace('</table>', `</table>
                    ${listeningShieldsCount !== null ? `<div style="display:flex;gap:8px;justify-content:center;margin:8px 0 4px">
                        <div style="flex:1;text-align:center;padding:10px;background:linear-gradient(135deg,#ecfeff,#cffafe);border-radius:12px;border:1px solid #a5f3fc">
                            <div style="font-size:20px;font-weight:700;color:#0891b2;margin-bottom:4px"><i class="fa-solid fa-headphones" style="margin-right:3px"></i>Listening: ${ls.score}/${ls.totalQuestions}</div>
                            <div>${renderShieldIcons(listeningShieldsCount)}</div>
                            <div style="font-size:20px;font-weight:800;color:#b45309;margin-top:2px">${listeningShieldsCount}/5</div>
                        </div>
                        <div style="flex:1;text-align:center;padding:10px;background:linear-gradient(135deg,#faf5ff,#f3e8ff);border-radius:12px;border:1px solid #d8b4fe">
                            <div style="font-size:20px;font-weight:700;color:#7c3aed;margin-bottom:4px"><i class="fa-solid fa-book-open" style="margin-right:3px"></i>Reading: ${totalCorrect}/${totalQuestions}</div>
                            <div>${renderShieldIcons(readingShieldsCount)}</div>
                            <div style="font-size:20px;font-weight:800;color:#b45309;margin-top:2px">${readingShieldsCount}/5</div>
                        </div>
                    </div>` : ''}`);

                readingCanReview = isTeacherMode || grandPct >= 80;
                let fullTestReviewClicked = false;
                Swal.fire({
                    title: 'Hoàn thành Full Test!',
                    html: resultHtml,
                    icon: 'success',
                    showConfirmButton: false,
                    showCloseButton: true,
                    width: '90%',
                    customClass: { popup: 'swal-result-popup' },
                    didOpen: () => {
                        const reviewBtn = document.getElementById('btn-review-reading');
                        if (!reviewBtn.disabled) {
                            reviewBtn.addEventListener('click', () => {
                                fullTestReviewClicked = true;
                                Swal.close();
                                renderReadingTabs();
                                renderReadingPart();
                            });
                        }
                        document.getElementById('btn-save-reading').addEventListener('click', async () => {
                            const card = document.getElementById('result-card');
                            const btns = card.querySelector('div[style*="display:flex;gap:12px;justify-content:center;margin-top"]');
                            if (btns) btns.style.display = 'none';
                            try {
                                const canvas = await html2canvas(card, { backgroundColor: '#ffffff', scale: 2 });
                                const link = document.createElement('a');
                                const safeName = (currentStudent ? currentStudent.englishName || currentStudent.name : 'result').replace(/\s+/g, '_');
                                link.download = `KetQua_FullTest_${safeName}_${new Date().toISOString().slice(0,10)}.png`;
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                            } catch(e) { console.error(e); }
                            if (btns) btns.style.display = 'flex';
                        });
                    },
                    didClose: () => {
                        if (!fullTestReviewClicked && !readingCanReview) doCloseReading();
                    }
                });

                fullTestMode = false;
                fullTestListeningScore = null;
                fullTestReadingData = null;
            } else {
                const readingShieldsCount = shieldThresholds[currentMaterialId] ? readingShields : null;
                const resultHtml = buildResultCard({
                    testTitle: readingData.title,
                    skillLabel: 'Reading',
                    partScores,
                    totalScore: totalCorrect,
                    totalMax: totalQuestions,
                    pct,
                    shields: readingShieldsCount,
                    studentName, studentEng, studentClass, timeStr,
                    reviewBtnId: 'btn-review-reading',
                    saveBtnId: 'btn-save-reading'
                });

                readingCanReview = isTeacherMode || pct >= 80;
                let readingReviewClicked = false;
                Swal.fire({
                    title: 'Nộp bài thành công!',
                    html: resultHtml,
                    icon: 'success',
                    showConfirmButton: false,
                    showCloseButton: true,
                    width: '90%',
                    customClass: { popup: 'swal-result-popup' },
                    didOpen: () => {
                        const reviewBtn = document.getElementById('btn-review-reading');
                        if (!reviewBtn.disabled) {
                            reviewBtn.addEventListener('click', () => {
                                readingReviewClicked = true;
                                Swal.close();
                                renderReadingTabs();
                                renderReadingPart();
                            });
                        }
                        document.getElementById('btn-save-reading').addEventListener('click', async () => {
                            const card = document.getElementById('result-card');
                            const btns = card.querySelector('div[style*="display:flex;gap:12px;justify-content:center;margin-top"]');
                            if (btns) btns.style.display = 'none';
                            try {
                                const canvas = await html2canvas(card, { backgroundColor: '#ffffff', scale: 2 });
                                const link = document.createElement('a');
                                const safeName = (currentStudent ? currentStudent.englishName || currentStudent.name : 'result').replace(/\s+/g, '_');
                                link.download = `KetQua_Reading_${safeName}_${new Date().toISOString().slice(0,10)}.png`;
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                            } catch(e) { console.error(e); }
                            if (btns) btns.style.display = 'flex';
                        });
                    },
                    didClose: () => {
                        if (!readingReviewClicked && !readingCanReview) doCloseReading();
                    }
                });
            }

            const btn = document.getElementById('btn-submit-reading');
            btn.innerHTML = '<i class="fa-solid fa-door-open mr-2"></i> Quay lại';
            btn.className = btn.className.replace('bg-turtle-500', 'bg-slate-600').replace('hover:bg-turtle-600', 'hover:bg-slate-700');
        }

        function closeReading() {
            if (!readingSubmitted) {
                Swal.fire({
                    title: 'Thoát bài làm?',
                    text: 'Bài làm của bạn sẽ không được lưu.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Thoát',
                    cancelButtonText: 'Ở lại',
                    confirmButtonColor: '#ef4444'
                }).then(r => {
                    if (r.isConfirmed) doCloseReading();
                });
            } else {
                doCloseReading();
            }
        }

        function doCloseReading() {
            document.getElementById('view-reading').classList.remove('active');
            document.getElementById('view-detail').classList.add('active');
            if (isLoggedIn) document.getElementById('main-nav').classList.remove('hidden');
            const btn = document.getElementById('btn-submit-reading');
            btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài';
            btn.className = btn.className.replace('bg-slate-600', 'bg-turtle-500').replace('hover:bg-slate-700', 'hover:bg-turtle-600');
        }

        // Lắng nghe sự kiện đổi URL (hash) để thay đổi view tương ứng
        window.addEventListener('hashchange', handleRouting);

        // Chạy hàm kiểm tra router lần đầu tiên khi vừa tải trang xong
        window.addEventListener('DOMContentLoaded', handleRouting);

    </script>
</body>
</html>
