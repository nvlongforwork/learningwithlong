                }

                // Answer cell
                let answerCell;
                if (item.type === 'color') {
                    if (listeningSubmitted) {
                        const isCorrect = answers[i].answer === item.answer;
                        const ansHex = colorHex[answers[i].answer] || '#ccc';
                        answerCell = answers[i].answer
                            ? `<span class="inline-block px-2 py-1 rounded-lg text-white font-bold text-base ${isCorrect ? '' : 'line-through opacity-60'}" style="background-color:${ansHex}">${answers[i].answer}</span>`
                            : `<span class="text-red-400 font-bold">—</span>`;
                        if (!isCorrect) answerCell += ` <span class="inline-block px-2 py-1 rounded-lg text-white font-bold text-base" style="background-color:${colorHex[item.answer]}">${item.answer}</span>`;
                    } else {
                        if (answers[i].answer) {
                            answerCell = `<div class="drop-slot filled cursor-pointer mx-auto w-24 h-10 rounded-lg text-white font-bold text-base flex items-center justify-center" style="background-color:${colorHex[answers[i].answer]};border-color:${colorHex[answers[i].answer]}" onclick="clickP5ColorSlot(${i})">${answers[i].answer}</div>`;
                        } else {
                            answerCell = `<div class="drop-slot cursor-pointer mx-auto w-24 h-10 text-base" onclick="clickP5ColorSlot(${i})"><span class="text-slate-400">Màu</span></div>`;
                        }
                    }
                } else {
                    if (listeningSubmitted) {
                        const isCorrect = answers[i].answer.toLowerCase().trim() === item.answer.toLowerCase().trim();
                        answerCell = `<input type="text" value="${answers[i].answer}" readonly class="w-full px-2 py-1 border-2 rounded-lg font-bold text-center text-base ${isCorrect ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-400 bg-red-50 text-red-700'}">`;
                        if (!isCorrect && item.answer) answerCell += `<div class="text-green-600 font-bold text-sm mt-1">${item.answer}</div>`;
                    } else {
                        answerCell = `<input type="text" value="${answers[i].answer}" placeholder="Write..." oninput="listeningAnswers[${activePart}][${i}].answer=this.value" class="w-full px-2 py-1 border-2 border-slate-200 rounded-lg focus:outline-none focus:border-turtle-400 font-medium text-center text-base">`;
                    }
                }

                html += `<tr>
                    <td class="p-2 font-bold text-slate-500">${item.num}</td>
                    <td class="p-2">${itemCell}</td>
                    <td class="p-2 text-center">${answerCell}</td>
                </tr>`;
            });

            html += `</tbody></table></div>
            </div>`;

            if (!listeningSubmitted) {
                html += `<div style="width:30%" class="flex flex-col gap-3">`;
                // Item word bank
                html += `<div class="bg-white rounded-2xl p-3 shadow-sm border">
                    <h4 class="font-bold text-slate-600 mb-2"><i class="fa-solid fa-list mr-1 text-indigo-500"></i> Items</h4>
                    <div class="flex flex-wrap gap-2">`;
                (part.itemBank || []).filter(it => it !== part.example.item).forEach(it => {
                    const isUsed = usedItems.includes(it);
                    const isSel = selectedItemChip === it;
                    html += `<div class="item-chip bank-chip ${isUsed ? 'used' : ''} ${isSel ? 'selected' : ''} px-3 py-1.5 bg-indigo-50 border border-indigo-200 rounded-lg font-medium text-indigo-700 text-base" onclick="selectItemChip('${it.replace(/'/g, "\\'")}',this)">${it}</div>`;
                });
                html += `</div></div>`;

                // Color palette
                html += `<div class="bg-white rounded-2xl p-3 shadow-sm border">
                    <h4 class="font-bold text-slate-600 mb-2"><i class="fa-solid fa-palette mr-1 text-pink-500"></i> Colours</h4>
                    <div class="flex flex-wrap gap-2">`;
                part.colors.forEach(c => {
                    const hex = colorHex[c] || '#999';
                    const isSel = selectedColor === c;
                    html += `<div class="color-chip ${isSel ? 'selected' : ''} px-3 py-2 rounded-lg cursor-pointer transition-all flex items-center justify-center text-base font-bold text-white shadow-sm hover:scale-105" style="background-color:${hex}" onclick="selectColor('${c}',this)">${c}</div>`;
                });
                html += `</div></div>`;
                html += `</div>`;
            }

            html += `</div></div>`;
            content.innerHTML = html;
        }

        function submitListeningTest() {
            if (listeningSubmitted) { closeListening(); return; }

            let totalAnswered = 0;
            let totalQuestions = 0;
            listeningData.parts.forEach((part, i) => {
                totalQuestions += part.questions;
                const ans = listeningAnswers[i];
                if (part.type === 'drag-match') {
                    totalAnswered += ans.filter(a => a.name && a.action).length;
                } else if (part.type === 'fill-blank') {
                    totalAnswered += ans.filter(a => a.trim()).length;
                } else if (part.type === 'drag-match-letters') {
                    totalAnswered += ans.filter(a => a).length;
                } else if (part.type === 'multiple-choice-abc') {
                    totalAnswered += ans.filter(a => a >= 0).length;
                } else if (part.type === 'color-write') {
                    totalAnswered += ans.filter(a => a.item && a.answer).length;
                }
            });

            const doSubmit = () => {
                let score = 0;
                listeningData.parts.forEach((part, i) => {
                    const ans = listeningAnswers[i];
                    if (part.type === 'drag-match') {
                        part.answers.forEach((correct, j) => {
                            if (ans[j].name === correct.name && ans[j].action === correct.action) score++;
                        });
                    } else if (part.type === 'fill-blank') {
                        part.rows.forEach((row, j) => {
                            if (row.answer && ans[j].toLowerCase().trim() === row.answer.toLowerCase().trim()) score++;
                        });
                    } else if (part.type === 'drag-match-letters') {
                        part.answers.forEach((correct, j) => {
                            if (ans[j] === correct.answer) score++;
                        });
                    } else if (part.type === 'multiple-choice-abc') {
                        part.items.forEach((item, j) => {
                            if (ans[j] === item.answer) score++;
                        });
                    } else if (part.type === 'color-write') {
                        part.items.forEach((item, j) => {
                            const itemCorrect = ans[j].item === item.item;
                            const ansCorrect = item.answer && ans[j].answer.toLowerCase().trim() === item.answer.toLowerCase().trim();
                            if (itemCorrect && ansCorrect) score++;
                        });
                    }
                });

                listeningSubmitted = true;
                Swal.fire({
                    title: 'Nộp bài thành công!',
                    html: `<div class="py-4"><p class="text-slate-500 mb-2">Điểm số của bạn:</p><div class="text-5xl font-bold text-turtle-600">${score} / ${totalQuestions}</div><p class="mt-4 text-sm text-slate-600">Xem lại đáp án ở từng phần nhé.</p></div>`,
                    icon: 'success',
                    confirmButtonColor: '#20a1a0',
                    confirmButtonText: 'Xem đáp án'
                }).then(() => {
                    const btn = document.getElementById('btn-submit-listening');
                    btn.innerHTML = '<i class="fa-solid fa-door-open mr-2"></i> Quay lại';
                    btn.className = btn.className.replace('bg-turtle-500', 'bg-slate-600').replace('hover:bg-turtle-600', 'hover:bg-slate-700');
                    activePart = 0;
                    renderListeningTabs();
                    renderListeningPart();
                });
            };

            if (totalAnswered < totalQuestions) {
                Swal.fire({
                    title: 'Khoan đã!',
                    html: `Bạn còn <b>${totalQuestions - totalAnswered} câu</b> chưa trả lời.<br>Nộp bài lúc này?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#20a1a0',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Nộp luôn',
                    cancelButtonText: 'Làm tiếp'
                }).then(r => { if (r.isConfirmed) doSubmit(); });
            } else {
                Swal.fire({
                    title: 'Xác nhận nộp bài',
                    text: 'Bạn đã hoàn thành. Nộp bài nhé?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#20a1a0',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Đồng ý nộp',
                    cancelButtonText: 'Kiểm tra lại'
                }).then(r => { if (r.isConfirmed) doSubmit(); });
            }
        }

        function closeListening() {
            if (!listeningSubmitted) {
                Swal.fire({
                    title: 'Thoát bài tập?',
                    text: 'Tiến độ sẽ không được lưu.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Thoát',
                    cancelButtonText: 'Ở lại'
                }).then(r => {
                    if (r.isConfirmed) doCloseListening();
                });
            } else {
                doCloseListening();
            }
        }

        function doCloseListening() {
            document.getElementById('view-listening').classList.remove('active');
            document.getElementById('view-detail').classList.add('active');
            if (isLoggedIn) document.getElementById('main-nav').classList.remove('hidden');
            const btn = document.getElementById('btn-submit-listening');
            btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài';
            btn.className = btn.className.replace('bg-slate-600', 'bg-turtle-500').replace('hover:bg-slate-700', 'hover:bg-turtle-600');
        }

        // Lắng nghe sự kiện đổi URL (hash) để thay đổi view tương ứng
        window.addEventListener('hashchange', handleRouting);

        // Chạy hàm kiểm tra router lần đầu tiên khi vừa tải trang xong
        window.addEventListener('DOMContentLoaded', handleRouting);

    </script>
</body>
