<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Language Materials</title>

    <!-- Tailwind CSS cho thiết kế responsive và UI -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome cho icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 để thay thế alert() mặc định, tạo thông báo đẹp mắt -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- html2canvas để chụp ảnh kết quả -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind config -->
    <script src="tailwind.config.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-700 min-h-screen flex flex-col">

    <!-- Navbar chung (sẽ ẩn ở màn hình đăng nhập) -->
    <nav id="main-nav" class="bg-white shadow-sm px-6 py-4 hidden sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 text-turtle-600 font-bold text-xl cursor-pointer hover-bounce" onclick="window.location.hash='#/dashboard'">
                <div class="bg-turtle-100 p-2 rounded-xl text-turtle-600">
                    <i class="fa-solid fa-earth-americas"></i>
                </div>
                <span>ELM Portal</span>
            </div>
            <div>
                <button id="logout-btn" class="text-slate-500 hover:text-turtle-600 font-medium px-4 py-2 rounded-xl hover:bg-turtle-50 transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col p-4 sm:p-6 w-full max-w-6xl mx-auto">

        <!-- VIEW 1: ĐĂNG NHẬP -->
        <section id="view-login" class="view-section active m-auto w-full max-w-md">
            <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-soft text-center hover-bounce">
                <div class="w-20 h-20 bg-turtle-100 rounded-3xl flex items-center justify-center mx-auto mb-6 text-turtle-500 text-4xl shadow-sm rotate-3 hover:rotate-0 transition-transform">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">ENGLISH LANGUAGE MATERIALS</h1>
                <p class="text-slate-500 text-sm mb-8">Dành riêng cho giáo viên. Vui lòng nhập mã truy cập.</p>

                <form id="login-form" class="space-y-6">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="teacher-code" placeholder="Nhập mã giáo viên"
                            class="w-full pl-11 pr-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-turtle-400 focus:bg-white transition-all shadow-inner font-medium"
                            required>
                        <button type="button" onclick="togglePasswordVisibility('teacher-code', this)" class="absolute inset-y-0 right-0 pr-4 flex items-center" style="background:none;border:none;cursor:pointer">
                            <i class="fa-solid fa-eye text-slate-400" style="font-size:20px"></i>
                        </button>
                    </div>

                    <button type="submit"
                        class="w-full py-4 px-6 bg-turtle-500 text-white font-bold rounded-2xl hover:bg-turtle-600 active:scale-95 transition-all shadow-lg shadow-turtle-500/30 flex items-center justify-center gap-2">
                        <span>Truy cập hệ thống</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </section>

        <!-- VIEW 2: DANH SÁCH TÀI LIỆU (DASHBOARD) -->
        <section id="view-dashboard" class="view-section w-full py-6">
            <div class="mb-10 text-center sm:text-left">
                <h2 class="text-3xl font-bold text-slate-800 mb-3">Tài liệu Giảng dạy</h2>
                <p class="text-slate-500">Chọn một học phần để xem chi tiết và giao bài tập cho học sinh.</p>
            </div>

            <!-- Vùng chứa danh sách Grid -->
            <div id="materials-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Nội dung được render bằng JavaScript tự động -->
            </div>
        </section>

        <!-- VIEW 3: CHI TIẾT TÀI LIỆU (MÀN HÌNH BÀI TẬP CÓ LINK RIÊNG) -->
        <section id="view-detail" class="view-section w-full py-6 max-w-4xl mx-auto">

            <button id="back-btn" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-slate-800 transition-colors font-medium w-fit hover-bounce">
                <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
            </button>

            <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-soft relative overflow-hidden">
                <!-- Decoration background -->
                <div class="absolute -top-16 -right-16 w-32 h-32 rounded-full blur-2xl detail-decor transition-colors duration-500"></div>

                <div class="relative z-10 flex flex-col md:flex-row gap-8 items-start md:items-center justify-between mb-8 pb-8 border-b border-slate-100">
                    <div class="flex items-center gap-5">
                        <div>
                            <h2 id="detail-title" class="text-2xl sm:text-3xl font-bold text-slate-800">Tên bài học</h2>
                            <p id="detail-subtitle" class="font-medium mt-1" style="color: var(--theme-color);">Bài tập thực hành</p>
                        </div>
                    </div>

                    <!-- Nút Copy Link dành cho giáo viên (Học sinh sẽ không thấy nút này) -->
                    <div id="teacher-tools" class="w-full md:w-auto hidden">
                        <button onclick="copyCurrentLink()" title="Copy Link" class="w-12 h-12 bg-slate-50 hover:bg-slate-800 hover:text-white border border-slate-200 font-semibold rounded-2xl transition-all flex items-center justify-center text-xl shadow-sm hover-bounce ml-auto" style="color: var(--theme-color);">
                            <i class="fa-solid fa-link"></i>
                        </button>
                    </div>
                </div>

                <!-- Vùng chứa nội dung động (Thư mục con hoặc Bài tập) -->
                <div id="dynamic-content-container" class="relative z-10">
                    <!-- Rendered by JS tự động -->
                </div>
            </div>
        </section>

    </main>

    <!-- VIEW 4: GIAO DIỆN LÀM BÀI FULL SCREEN (ẨN MẶC ĐỊNH) -->
    <section id="view-quiz" class="view-section fixed inset-0 z-[100] bg-slate-50 flex-col overflow-hidden" style="display: none;">
        <!-- Quiz Header -->
        <header class="bg-white px-4 py-3 shadow-sm flex items-center justify-between shrink-0 z-10 relative">
            <div class="flex items-center gap-3">
                <button onclick="closeQuiz()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
                <h2 id="quiz-title" class="text-lg font-bold text-slate-800 hidden sm:block">Tên Bài Tập</h2>
            </div>

            <!-- Nhập thông tin học sinh -->
            <div class="flex items-center gap-2 sm:gap-4">
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" placeholder="Họ và tên" class="pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm w-32 sm:w-48 focus:outline-none focus:border-turtle-400 focus:bg-white transition-colors">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-school absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" placeholder="Lớp" class="pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm w-20 sm:w-28 focus:outline-none focus:border-turtle-400 focus:bg-white transition-colors">
                </div>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2 sm:h-3 shrink-0">
            <div id="quiz-progress" class="bg-turtle-500 h-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>

        <!-- Quiz Body (Side by Side trên máy tính 16:9, Stack trên điện thoại 9:16) -->
        <div class="flex-1 flex flex-col md:flex-row p-4 sm:p-6 lg:p-8 gap-4 sm:gap-6 overflow-hidden min-h-0 max-w-[1600px] mx-auto w-full">

            <!-- Cột trái: Nội dung Câu hỏi -->
            <div class="w-full md:w-5/12 lg:w-1/2 bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-10 flex flex-col justify-center items-center overflow-y-auto custom-scrollbar relative">
                <div class="absolute top-6 left-6 px-4 py-1.5 bg-slate-100 rounded-full text-slate-500 font-bold text-sm tracking-wide">
                    CÂU HỎI <span id="q-num" class="text-turtle-600 text-lg ml-1">1</span>
                </div>
                <p id="q-text" class="text-2xl sm:text-3xl lg:text-4xl font-bold text-slate-800 text-center leading-relaxed mt-10">
                    Loading question...
                </p>
            </div>

            <!-- Cột phải: Các đáp án & Giải thích -->
            <div class="w-full md:w-7/12 lg:w-1/2 flex flex-col gap-3 sm:gap-4 overflow-y-auto custom-scrollbar p-2" id="a-container">
                <!-- Nút đáp án được render bằng JS -->
            </div>
        </div>

        <!-- Footer: Navigator chọn câu hỏi nhỏ gọn -->
        <footer class="bg-white border-t border-slate-200 p-3 sm:p-5 shrink-0 shadow-[0_-10px_20px_rgba(0,0,0,0.04)] flex flex-col sm:flex-row items-center justify-between gap-4 z-10 relative">

            <!-- Bảng chọn câu hỏi -->
            <div id="quiz-navigator" class="flex flex-wrap gap-2 sm:gap-3 justify-center flex-1">
               <!-- Các nút số thứ tự câu hỏi sinh ra tự động -->
            </div>

            <!-- Nút Nộp bài -->
            <button id="btn-submit-quiz" onclick="submitQuizAction()" class="w-full sm:w-auto py-3 sm:py-4 px-8 sm:px-12 bg-turtle-500 text-white font-bold text-lg rounded-2xl hover:bg-turtle-600 active:scale-95 transition-all shadow-lg hover-bounce whitespace-nowrap">
                <i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài ngay
            </button>
        </footer>
    </section>

    <!-- Listening Test View -->
    <section id="view-listening" class="view-section fixed inset-0 z-[100] bg-slate-50 flex-col overflow-hidden" style="display: none;">
        <header class="bg-white px-4 py-3 shadow-sm flex items-center justify-between shrink-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="closeListening()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
                <h2 id="listening-title" class="text-lg font-bold text-slate-800 hidden sm:block"></h2>
                <div class="test-header-tools flex items-center gap-1 ml-2">
                    <button onclick="changeFontSize(-2)" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Giảm cỡ chữ"><i class="fa-solid fa-minus" style="font-size:12px;color:#64748b"></i></button>
                    <button onclick="changeFontSize(2)" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Tăng cỡ chữ"><i class="fa-solid fa-plus" style="font-size:12px;color:#64748b"></i></button>
                    <div class="w-px h-5 bg-slate-300 mx-1"></div>
                    <button onclick="toggleHighlight('yellow')" id="hl-yellow-listening" class="hl-btn w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center" style="background:#fef08a" title="Highlight vàng"><i class="fa-solid fa-highlighter" style="font-size:12px;color:#a16207"></i></button>
                    <button onclick="toggleHighlight('green')" id="hl-green-listening" class="hl-btn w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center" style="background:#bbf7d0" title="Highlight xanh"><i class="fa-solid fa-highlighter" style="font-size:12px;color:#15803d"></i></button>
                    <button onclick="removeHighlight()" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Xoá highlight"><i class="fa-solid fa-eraser" style="font-size:12px;color:#64748b"></i></button>
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <div id="listening-student-info" class="flex items-center gap-3 text-sm"></div>
                <button id="btn-submit-listening" onclick="submitListeningTest()" class="py-1.5 px-4 bg-turtle-500 text-white font-semibold rounded-xl hover:bg-turtle-600 transition-all shadow hover-bounce" style="font-size:20px">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài
                </button>
            </div>
        </header>
        <div id="listening-tabs" class="bg-white border-b px-4 py-2 flex gap-2 shrink-0"></div>
        <div id="listening-audio-box" class="bg-slate-100 px-4 py-3 border-b shrink-0 flex items-center justify-center">
            <audio id="listening-audio-player" controls class="w-full max-w-xl h-10"></audio>
        </div>
        <div id="listening-content" class="flex-1 overflow-y-auto p-2 sm:p-4 custom-scrollbar"></div>
        <footer class="bg-white border-t p-3 sm:p-5 shrink-0 flex items-center justify-between z-10">
            <button id="btn-back-listening" onclick="navListeningPart(-1)" class="py-2 px-5 bg-slate-200 text-slate-700 font-semibold rounded-xl hover:bg-slate-300 transition-all">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back
            </button>
            <button id="btn-next-listening" onclick="navListeningPart(1)" class="py-2 px-5 bg-turtle-500 text-white font-semibold rounded-xl hover:bg-turtle-600 transition-all shadow">
                Next <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </footer>
    </section>

    <section id="view-fulltest" class="view-section fixed inset-0 z-[100] bg-slate-50 flex-col overflow-hidden" style="display: none;">
        <header class="bg-white px-4 py-3 shadow-sm flex items-center justify-between shrink-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="closeFullTest()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
                <h2 id="fulltest-title" class="text-lg font-bold text-slate-800 hidden sm:block"></h2>
                <div class="test-header-tools flex items-center gap-1 ml-2">
                    <button onclick="changeFontSize(-2)" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Giảm cỡ chữ"><i class="fa-solid fa-minus" style="font-size:12px;color:#64748b"></i></button>
                    <button onclick="changeFontSize(2)" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Tăng cỡ chữ"><i class="fa-solid fa-plus" style="font-size:12px;color:#64748b"></i></button>
                    <div class="w-px h-5 bg-slate-300 mx-1"></div>
                    <button onclick="toggleHighlight('yellow')" id="hl-yellow-fulltest" class="hl-btn w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center" style="background:#fef08a" title="Highlight vàng"><i class="fa-solid fa-highlighter" style="font-size:12px;color:#a16207"></i></button>
                    <button onclick="toggleHighlight('green')" id="hl-green-fulltest" class="hl-btn w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center" style="background:#bbf7d0" title="Highlight xanh"><i class="fa-solid fa-highlighter" style="font-size:12px;color:#15803d"></i></button>
                    <button onclick="removeHighlight()" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Xoá highlight"><i class="fa-solid fa-eraser" style="font-size:12px;color:#64748b"></i></button>
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <div id="exam-timer-display" class="items-center gap-2 px-4 py-2 rounded-xl font-bold" style="display:none;background:linear-gradient(135deg,#fee2e2,#fecaca);color:#dc2626;font-size:20px;border:2px solid #fca5a5;">
                    <i class="fa-solid fa-clock"></i>
                    <span id="exam-timer-text">00:00</span>
                </div>
                <div id="fulltest-student-info" class="flex items-center gap-3 text-sm"></div>
                <button id="btn-submit-fulltest" onclick="submitFullTest()" class="py-1.5 px-4 bg-turtle-500 text-white font-semibold rounded-xl hover:bg-turtle-600 transition-all shadow hover-bounce" style="font-size:20px">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài
                </button>
            </div>
        </header>
        <div id="fulltest-skill-tabs" class="bg-white border-b px-4 py-2 flex gap-2 shrink-0"></div>
        <div id="fulltest-part-tabs" class="bg-slate-50 border-b px-4 py-2 flex gap-2 shrink-0"></div>
        <div id="fulltest-audio-box" class="bg-slate-100 px-4 py-3 border-b shrink-0 flex items-center justify-center" style="display:none">
            <audio id="fulltest-audio-player" controls class="w-full max-w-xl h-10"></audio>
        </div>
        <div id="fulltest-content" class="flex-1 overflow-y-auto p-2 sm:p-4 custom-scrollbar"></div>
        <footer class="bg-white border-t p-3 sm:p-5 shrink-0 flex items-center justify-between z-10">
            <button id="btn-back-fulltest" onclick="navFullTestPart(-1)" class="py-2 px-5 bg-slate-200 text-slate-700 font-semibold rounded-xl hover:bg-slate-300 transition-all">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back
            </button>
            <button id="btn-next-fulltest" onclick="navFullTestPart(1)" class="py-2 px-5 bg-turtle-500 text-white font-semibold rounded-xl hover:bg-turtle-600 transition-all shadow">
                Next <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </footer>
    </section>

    <section id="view-reading" class="view-section fixed inset-0 z-[100] bg-slate-50 flex-col overflow-hidden" style="display: none;">
        <header class="bg-white px-4 py-3 shadow-sm flex items-center justify-between shrink-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="closeReading()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
                <h2 id="reading-title" class="text-lg font-bold text-slate-800 hidden sm:block"></h2>
                <div class="test-header-tools flex items-center gap-1 ml-2">
                    <button onclick="changeFontSize(-2)" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Giảm cỡ chữ"><i class="fa-solid fa-minus" style="font-size:12px;color:#64748b"></i></button>
                    <button onclick="changeFontSize(2)" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Tăng cỡ chữ"><i class="fa-solid fa-plus" style="font-size:12px;color:#64748b"></i></button>
                    <div class="w-px h-5 bg-slate-300 mx-1"></div>
                    <button onclick="toggleHighlight('yellow')" id="hl-yellow-reading" class="hl-btn w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center" style="background:#fef08a" title="Highlight vàng"><i class="fa-solid fa-highlighter" style="font-size:12px;color:#a16207"></i></button>
                    <button onclick="toggleHighlight('green')" id="hl-green-reading" class="hl-btn w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center" style="background:#bbf7d0" title="Highlight xanh"><i class="fa-solid fa-highlighter" style="font-size:12px;color:#15803d"></i></button>
                    <button onclick="removeHighlight()" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-slate-400 transition-all flex items-center justify-center bg-slate-100" title="Xoá highlight"><i class="fa-solid fa-eraser" style="font-size:12px;color:#64748b"></i></button>
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <div id="reading-student-info" class="flex items-center gap-3 text-sm"></div>
                <button id="btn-submit-reading" onclick="submitReadingTest()" class="py-1.5 px-4 bg-turtle-500 text-white font-semibold rounded-xl hover:bg-turtle-600 transition-all shadow hover-bounce" style="font-size:20px">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài
                </button>
            </div>
        </header>
        <div id="reading-tabs" class="bg-white border-b px-4 py-2 flex gap-2 shrink-0"></div>
        <div id="reading-audio-box" class="px-4 py-2 bg-slate-50 border-b shrink-0" style="display:none">
            <audio id="reading-audio-player" class="w-full"></audio>
        </div>
        <div id="reading-content" class="flex-1 overflow-y-auto p-2 sm:p-4 custom-scrollbar"></div>
        <footer class="bg-white border-t p-3 sm:p-5 shrink-0 flex items-center justify-between z-10">
            <button id="btn-back-reading" onclick="navReadingPart(-1)" class="py-2 px-5 bg-slate-200 text-slate-700 font-semibold rounded-xl hover:bg-slate-300 transition-all">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back
            </button>
            <button id="btn-next-reading" onclick="navReadingPart(1)" class="py-2 px-5 bg-turtle-500 text-white font-semibold rounded-xl hover:bg-turtle-600 transition-all shadow">
                Next <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </footer>
    </section>

    <!-- App JavaScript -->
    <script src="app.js"></script>
</body>
</html>
