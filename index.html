<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELM Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root {
  --turtle: #20a1a0;
  --turtle-light: #e0f5f5;
  --turtle-dark: #178786;
  --turtle-bg: #f0fafa;
  --radius: 1rem;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#fff; color:#333; min-height:100vh; }

.bounce { transition: transform .2s ease; }
.bounce:hover { transform: scale(1.05); }
.bounce:active { transform: scale(0.97); }

/* login */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--turtle-bg),#fff); }
.login-box { background:#fff; border-radius:var(--radius); box-shadow:0 8px 32px rgba(32,161,160,.15); padding:2.5rem; width:90%; max-width:400px; text-align:center; }
.login-box h1 { font-size:1.5rem; font-weight:800; color:var(--turtle); margin-bottom:.5rem; line-height:1.3; }
.login-box p { color:#888; font-size:.9rem; margin-bottom:1.5rem; }
.login-input { width:100%; padding:.85rem 1rem; border:2px solid #e0e0e0; border-radius:.75rem; font-size:1.1rem; text-align:center; outline:none; transition:border .2s; font-family:inherit; }
.login-input:focus { border-color:var(--turtle); }
.login-btn { width:100%; margin-top:1rem; padding:.85rem; background:var(--turtle); color:#fff; border:none; border-radius:.75rem; font-size:1.1rem; font-weight:600; cursor:pointer; font-family:inherit; }
.login-btn:hover { background:var(--turtle-dark); }
.login-err { color:#e74c3c; font-size:.85rem; margin-top:.75rem; display:none; }

/* material grid */
.mat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:1rem; padding:1rem; max-width:900px; margin:0 auto; }
.mat-card { border-radius:var(--radius); padding:1.5rem 1rem; text-align:center; color:#fff; font-weight:700; font-size:1.1rem; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.1); min-height:120px; display:flex; align-items:center; justify-content:center; }

/* top bar */
.top-bar { background:var(--turtle); color:#fff; padding:.75rem 1rem; display:flex; align-items:center; gap:.75rem; position:sticky; top:0; z-index:50; }
.top-bar button { background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; }
.top-bar h2 { font-size:1rem; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* folder / topic list */
.list-wrap { max-width:700px; margin:1rem auto; padding:0 1rem; }
.list-item { display:flex; align-items:center; gap:.75rem; padding:1rem; background:#fff; border-radius:var(--radius); margin-bottom:.6rem; box-shadow:0 2px 8px rgba(0,0,0,.06); cursor:pointer; font-weight:500; font-size:1.05rem; border-left:4px solid var(--turtle); }
.list-item:hover { background:var(--turtle-bg); }
.list-item i { color:var(--turtle); width:1.5rem; text-align:center; }

/* exercise full screen */
.ex-screen { position:fixed; inset:0; background:#fff; z-index:100; display:flex; flex-direction:column; overflow:hidden; }
.ex-top { background:var(--turtle); color:#fff; padding:.6rem 1rem; display:flex; align-items:center; gap:.75rem; flex-shrink:0; }
.ex-top button { background:none; border:none; color:#fff; font-size:1.1rem; cursor:pointer; }
.ex-top .ex-title { flex:1; font-weight:600; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ex-progress-bar { height:4px; background:rgba(32,161,160,.2); flex-shrink:0; }
.ex-progress-fill { height:100%; background:var(--turtle); transition:width .3s; }

.ex-body { flex:1; display:flex; overflow:hidden; }
.ex-left { flex:1; overflow-y:auto; padding:1.5rem; display:flex; flex-direction:column; }
.ex-right { width:320px; background:var(--turtle-bg); border-left:2px solid #d0eded; overflow-y:auto; padding:1.25rem; flex-shrink:0; display:flex; flex-direction:column; }

/* question nav */
.q-nav { display:flex; flex-wrap:wrap; gap:.4rem; padding:.75rem 1rem; background:#f8f8f8; border-top:1px solid #eee; flex-shrink:0; justify-content:center; }
.q-dot { width:2.2rem; height:2.2rem; border-radius:50%; border:2px solid #ccc; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:600; cursor:pointer; background:#fff; color:#666; transition:all .2s; }
.q-dot.active { border-color:var(--turtle); background:var(--turtle); color:#fff; }
.q-dot.done { border-color:#4ade80; background:#d1fae5; color:#16a34a; }

/* exercise cards */
.ex-instruction { font-size:1rem; font-weight:600; color:var(--turtle-dark); margin-bottom:1rem; }
.ex-card { background:#fff; border-radius:var(--radius); padding:1rem; margin-bottom:.75rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.ex-card img { border-radius:.75rem; max-width:100%; height:auto; }
.ex-card-img-wrap { display:flex; justify-content:center; margin-bottom:.75rem; }
.ex-card-img-wrap img { width:120px; height:auto; }

/* word bank chips */
.wb-chip { display:inline-block; padding:.5rem .9rem; background:#fff; border:2px solid var(--turtle); color:var(--turtle); border-radius:2rem; font-weight:600; font-size:.95rem; cursor:pointer; margin:.25rem; transition:all .2s; user-select:none; }
.wb-chip:hover { background:var(--turtle); color:#fff; }
.wb-chip.used { opacity:.35; pointer-events:none; text-decoration:line-through; }

/* answer input */
.ans-input { border:none; border-bottom:2px solid #ccc; background:transparent; font-size:1.1rem; font-family:inherit; font-weight:600; padding:.3rem .2rem; outline:none; min-width:80px; text-align:center; color:var(--turtle-dark); }
.ans-input:focus { border-color:var(--turtle); }
.ans-input.correct { border-color:#4ade80; color:#16a34a; }
.ans-input.wrong { border-color:#f87171; color:#ef4444; }
.ans-input.given { color:#999; }

/* passage */
.passage-block { background:#fafafa; border-radius:var(--radius); padding:1.25rem; margin-bottom:1rem; line-height:2; font-size:1.05rem; }
.passage-header { font-weight:700; color:var(--turtle); margin-bottom:.5rem; font-size:1rem; }
.blank-num { font-size:.75rem; color:#999; vertical-align:super; margin-right:2px; }

/* drag sort */
.ds-cat { flex:1; min-width:0; }
.ds-cat-title { text-align:center; font-weight:700; color:#fff; background:var(--turtle); padding:.5rem; border-radius:.75rem .75rem 0 0; font-size:.95rem; }
.ds-drop { min-height:120px; background:#f0fafa; border:2px dashed #b0dede; border-radius:0 0 .75rem .75rem; padding:.5rem; }
.ds-drop.drag-over { background:#d0f0f0; border-color:var(--turtle); }
.ds-word { display:inline-block; padding:.45rem .8rem; background:var(--turtle); color:#fff; border-radius:2rem; font-weight:600; font-size:.9rem; margin:.25rem; cursor:grab; user-select:none; }
.ds-word:active { cursor:grabbing; }

/* image type */
.it-card { display:flex; align-items:center; gap:1rem; padding:.75rem; background:#fff; border-radius:var(--radius); margin-bottom:.6rem; box-shadow:0 1px 6px rgba(0,0,0,.05); }
.it-card img { width:80px; height:80px; object-fit:cover; border-radius:.75rem; }
.it-labels { flex:1; display:flex; flex-direction:column; gap:.4rem; }
.it-row { display:flex; align-items:center; gap:.5rem; font-size:.95rem; }
.it-row span { font-weight:500; color:#888; min-width:3rem; }

/* story type */
.st-context { background:var(--turtle-bg); border-radius:var(--radius); padding:1rem; margin-bottom:1rem; font-size:.95rem; color:#555; line-height:1.6; border-left:4px solid var(--turtle); }
.st-item { display:flex; flex-wrap:wrap; align-items:center; gap:.3rem; padding:.75rem 0; font-size:1.05rem; line-height:1.8; border-bottom:1px solid #f0f0f0; }
.st-num { font-weight:700; color:var(--turtle); margin-right:.3rem; }
.st-opt { padding:.4rem .75rem; border:2px solid #ddd; border-radius:2rem; cursor:pointer; font-weight:500; font-size:.9rem; transition:all .2s; }
.st-opt:hover { border-color:var(--turtle); background:var(--turtle-bg); }
.st-opt.selected { border-color:var(--turtle); background:var(--turtle); color:#fff; }
.st-opt.correct { border-color:#4ade80; background:#d1fae5; color:#16a34a; }
.st-opt.wrong { border-color:#f87171; background:#fee2e2; color:#ef4444; }

.share-btn { background:none; border:1px solid rgba(255,255,255,.5); color:#fff; padding:.3rem .6rem; border-radius:.5rem; font-size:.8rem; cursor:pointer; white-space:nowrap; }
.share-btn:hover { background:rgba(255,255,255,.15); }

.check-btn { width:100%; padding:.85rem; background:var(--turtle); color:#fff; border:none; border-radius:var(--radius); font-size:1.1rem; font-weight:700; cursor:pointer; font-family:inherit; margin-top:auto; }
.check-btn:hover { background:var(--turtle-dark); }

.not-avail { text-align:center; padding:3rem 1rem; color:#aaa; }
.not-avail i { font-size:3rem; margin-bottom:1rem; display:block; color:#ccc; }

@media (max-width:768px) {
  .ex-body { flex-direction:column; }
  .ex-right { width:100%; border-left:none; border-top:2px solid #d0eded; max-height:40vh; }
  .ex-left { padding:1rem; }
  .mat-grid { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
  .mat-card { min-height:100px; font-size:1rem; padding:1.25rem .75rem; }
  .login-box { padding:2rem 1.5rem; }
  .ex-card-img-wrap img { width:90px; }
}
@media (max-width:480px) {
  .mat-grid { grid-template-columns:repeat(2,1fr); gap:.75rem; }
  .mat-card { min-height:90px; font-size:.9rem; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const TEACHER_CODE = '123';

const materialsData = [
  { id:'pre-a1-starters', name:'Pre-A1 Starters', color:'#F5A623', icon:'fa-star',
    folders:[{id:'i-dictionary',name:'I Dictionary'}] },
  { id:'a1-movers', name:'A1 Movers', color:'#A8C63B', icon:'fa-shoe-prints',
    folders:[{id:'i-dictionary',name:'I Dictionary', topics:[
      {id:'animals',name:'Animals'},{id:'the-body',name:'The Body'},
      {id:'people',name:'People'},{id:'food-and-drink',name:'Food and Drink'},
      {id:'health',name:'Health'},{id:'the-home',name:'The Home'},
      {id:'time',name:'Time'},{id:'sports-and-leisure',name:'Sports and Leisure'},
      {id:'numbers',name:'Numbers'},{id:'places',name:'Places'},
      {id:'weather-and-clothes',name:'Weather and Clothes'},{id:'our-world',name:'Our World'},
      {id:'past-verbs',name:'Past Verbs'},{id:'adjectives',name:'Adjectives'},
      {id:'revision',name:'Revision'}
    ]}] },
  { id:'a2-flyers', name:'A2 Flyers', color:'#21B6A8', icon:'fa-paper-plane',
    folders:[{id:'i-dictionary',name:'I Dictionary'}] },
  { id:'a2-key', name:'A2 Key', color:'#00AFA9', icon:'fa-key', folders:[] },
  { id:'b1-preliminary', name:'B1 Preliminary', color:'#009D98', icon:'fa-book', folders:[] },
  { id:'b2-first', name:'B2 First', color:'#008F9C', icon:'fa-graduation-cap', folders:[] },
  { id:'c1-advanced', name:'C1 Advanced', color:'#148DA8', icon:'fa-trophy', folders:[] }
];

let currentData = null;
let answers = {};

function isLoggedIn() {
  return sessionStorage.getItem('elm_logged') === '1';
}

function router() {
  const hash = location.hash.slice(2) || '';
  const parts = hash.split('/').filter(Boolean);

  if (parts[0] === 'ex') {
    loadExercise(parts[1], parts[2], parts[3]);
    return;
  }

  if (!isLoggedIn()) { renderLogin(); return; }

  if (parts[0] === 'material') {
    const mat = materialsData.find(m => m.id === parts[1]);
    if (!mat) { renderMaterials(); return; }
    if (parts[3]) { loadExercise(parts[1], parts[2], parts[3]); return; }
    if (parts[2]) {
      const folder = (mat.folders||[]).find(f => f.id === parts[2]);
      if (folder && folder.topics) { renderTopics(mat, folder); return; }
      loadExercise(parts[1], parts[2]);
      return;
    }
    renderFolders(mat);
    return;
  }

  renderMaterials();
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div style="font-size:3rem;color:var(--turtle);margin-bottom:.75rem"><i class="fas fa-chalkboard-teacher"></i></div>
        <h1>ENGLISH LANGUAGE<br>MATERIAL</h1>
        <p>Teacher Access Portal</p>
        <input class="login-input" id="codeInput" type="password" placeholder="Nhập mã giáo viên" maxlength="10" autofocus>
        <button class="login-btn bounce" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
        <div class="login-err" id="loginErr">Mã không đúng. Vui lòng thử lại.</div>
      </div>
    </div>`;
  setTimeout(() => {
    const inp = document.getElementById('codeInput');
    if (inp) inp.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  }, 0);
}

function doLogin() {
  const v = document.getElementById('codeInput').value.trim();
  if (v === TEACHER_CODE) {
    sessionStorage.setItem('elm_logged','1');
    location.hash = '#/';
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('codeInput').value = '';
    document.getElementById('codeInput').focus();
  }
}

function renderMaterials() {
  document.getElementById('app').innerHTML = `
    <div class="top-bar">
      <i class="fas fa-chalkboard-teacher" style="font-size:1.3rem"></i>
      <h2>ELM Portal</h2>
      <button onclick="sessionStorage.removeItem('elm_logged');location.hash='#/'" title="Đăng xuất"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    <div style="padding:1.5rem 1rem .5rem;text-align:center">
      <h2 style="font-size:1.3rem;font-weight:700;color:var(--turtle)">Chọn giáo trình</h2>
      <p style="color:#999;font-size:.85rem;margin-top:.3rem">Nhấn vào một giáo trình để xem nội dung</p>
    </div>
    <div class="mat-grid">
      ${materialsData.map(m => `
        <div class="mat-card bounce" style="background:${m.color}" onclick="location.hash='#/material/${m.id}'">
          <div><i class="fas ${m.icon}" style="font-size:1.8rem;margin-bottom:.5rem;display:block;opacity:.8"></i>${m.name}</div>
        </div>`).join('')}
    </div>`;
}

function renderFolders(mat) {
  const folders = mat.folders || [];
  document.getElementById('app').innerHTML = `
    <div class="top-bar" style="background:${mat.color}">
      <button onclick="location.hash='#/'"><i class="fas fa-arrow-left"></i></button>
      <h2>${mat.name}</h2>
      <button class="share-btn" onclick="copyLink()"><i class="fas fa-link"></i> Link</button>
    </div>
    <div class="list-wrap">
      ${folders.length ? folders.map(f => `
        <div class="list-item bounce" onclick="location.hash='#/material/${mat.id}/${f.id}'" style="border-left-color:${mat.color}">
          <i class="fas fa-folder"></i> ${f.name}
        </div>`).join('') : notAvail()}
    </div>`;
}

function renderTopics(mat, folder) {
  const topics = folder.topics || [];
  document.getElementById('app').innerHTML = `
    <div class="top-bar" style="background:${mat.color}">
      <button onclick="location.hash='#/material/${mat.id}'"><i class="fas fa-arrow-left"></i></button>
      <h2>${mat.name} — ${folder.name}</h2>
      <button class="share-btn" onclick="copyLink()"><i class="fas fa-link"></i> Link</button>
    </div>
    <div class="list-wrap">
      ${topics.length ? topics.map(t => `
        <div class="list-item bounce" onclick="location.hash='#/material/${mat.id}/${folder.id}/${t.id}'" style="border-left-color:${mat.color}">
          <i class="fas fa-file-alt"></i> ${t.name}
        </div>`).join('') : notAvail()}
    </div>`;
}

function notAvail() {
  return `<div class="not-avail"><i class="fas fa-clock"></i><p>Nội dung chưa được cập nhật.<br>Vui lòng quay lại sau.</p></div>`;
}

function copyLink() {
  navigator.clipboard.writeText(location.href).then(() =>
    Swal.fire({icon:'success',title:'Đã sao chép!',text:'Link đã được sao chép vào clipboard.',timer:1500,showConfirmButton:false})
  );
}

/* ── Load Exercise ── */
async function loadExercise(matId, folderId, topicId) {
  const mat = materialsData.find(m => m.id === matId);
  const path = topicId
    ? `data/${matId}/${folderId}/${topicId}.json`
    : `data/${matId}/${folderId}.json`;

  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error('not found');
    currentData = await res.json();
    answers = {};
    renderExercise(mat, currentData, 0);
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="top-bar" style="background:${mat?mat.color:'var(--turtle)'}">
        <button onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <h2>${mat?mat.name:'Exercise'}</h2>
      </div>
      <div class="list-wrap">${notAvail()}</div>`;
  }
}

/* ── Render Exercise ── */
function renderExercise(mat, data, exIdx) {
  const exercises = data.exercises;
  const ex = exercises[exIdx];
  const color = mat ? mat.color : 'var(--turtle)';
  const totalQ = countQuestions(ex);
  const answeredQ = countAnswered(ex, exIdx);
  const pct = totalQ ? Math.round(answeredQ/totalQ*100) : 0;

  document.getElementById('app').innerHTML = `
    <div class="ex-screen">
      <div class="ex-top" style="background:${color}">
        <button onclick="exitExercise()"><i class="fas fa-times"></i></button>
        <span class="ex-title">${data.title} — ${ex.title}</span>
        <button class="share-btn" onclick="copyLink()"><i class="fas fa-link"></i> Link</button>
      </div>
      <div class="ex-progress-bar"><div class="ex-progress-fill" style="width:${pct}%"></div></div>
      <div class="ex-body">
        <div class="ex-left" id="exLeft"></div>
        <div class="ex-right" id="exRight"></div>
      </div>
      ${exercises.length > 1 ? `
      <div class="q-nav" id="exNav">
        ${exercises.map((e,i) => `<div class="q-dot ${i===exIdx?'active':''} ${isExDone(e,i)?'done':''}" onclick="switchEx(${i})">${i+1}</div>`).join('')}
      </div>` : ''}
    </div>`;

  renderExContent(ex, exIdx, color);
}

function exitExercise() {
  answers = {};
  currentData = null;
  history.back();
}

function switchEx(idx) {
  renderExercise(getMat(), currentData, idx);
}

function getMat() {
  const parts = location.hash.slice(2).split('/').filter(Boolean);
  const matId = parts[1] || parts[0];
  return materialsData.find(m => m.id === matId) || materialsData[0];
}

function renderExContent(ex, exIdx, color) {
  const left = document.getElementById('exLeft');
  const right = document.getElementById('exRight');
  switch(ex.type) {
    case 'word-bank-fill': renderWordBankFill(ex, exIdx, left, right); break;
    case 'passage-fill':   renderPassageFill(ex, exIdx, left, right); break;
    case 'drag-sort':      renderDragSort(ex, exIdx, left, right); break;
    case 'image-type':     renderImageType(ex, exIdx, left, right); break;
    case 'story-type':     renderStoryType(ex, exIdx, left, right); break;
    default: left.innerHTML = `<p>Loại bài tập không được hỗ trợ.</p>`;
  }
}

/* ── Type 1: Word Bank Fill ── */
function renderWordBankFill(ex, exIdx, left, right) {
  const key = 'ex'+exIdx;
  if (!answers[key]) answers[key] = {};

  left.innerHTML = `
    <div class="ex-instruction"><i class="fas fa-pencil-alt"></i> ${ex.instruction}</div>
    <div id="wbItems">${ex.items.map(item => {
      const val = item.given ? item.answer : (answers[key][item.id] || '');
      return `
      <div class="ex-card" style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
        <div class="ex-card-img-wrap" style="margin-bottom:0"><img src="${item.img}" alt=""></div>
        <div style="flex:1;min-width:100px">
          ${item.given
            ? `<input class="ans-input given" value="${item.answer}" disabled style="width:100%"><div style="font-size:.75rem;color:#999;margin-top:.2rem">Mẫu</div>`
            : `<input class="ans-input" id="wb_${item.id}" value="${escAttr(val)}" placeholder="..." oninput="saveWB('${key}','${item.id}',this.value,${exIdx})" style="width:100%">`}
        </div>
      </div>`;
    }).join('')}</div>`;

  right.innerHTML = `
    <div style="font-weight:600;color:var(--turtle-dark);margin-bottom:.75rem"><i class="fas fa-th"></i> Ngân hàng từ</div>
    <div id="wbBank">${renderWordBank(ex.wordBank, answers[key])}</div>
    <button class="check-btn bounce" onclick="checkWB(${exIdx})"><i class="fas fa-check-circle"></i> Kiểm tra</button>`;
}

function renderWordBank(bank, ans) {
  const used = Object.values(ans).map(v => v.toLowerCase());
  return bank.map(w => {
    const u = used.includes(w.toLowerCase());
    return `<span class="wb-chip ${u?'used':''}" onclick="pickWord('${esc(w)}')">${w}</span>`;
  }).join('');
}

function pickWord(word) {
  const exIdx = getCurrentExIdx();
  const key = 'ex'+exIdx;
  const ex = currentData.exercises[exIdx];
  if (!answers[key]) answers[key] = {};

  for (const item of ex.items) {
    if (item.given) continue;
    const inp = document.getElementById('wb_'+item.id);
    if (inp && !inp.value.trim()) {
      inp.value = word;
      answers[key][item.id] = word;
      break;
    }
  }
  document.getElementById('wbBank').innerHTML = renderWordBank(ex.wordBank, answers[key]);
  updateProgress(exIdx);
}

function saveWB(key, id, val, exIdx) {
  if (!answers[key]) answers[key] = {};
  answers[key][id] = val;
  const ex = currentData.exercises[exIdx];
  document.getElementById('wbBank').innerHTML = renderWordBank(ex.wordBank, answers[key]);
  updateProgress(exIdx);
}

function checkWB(exIdx) {
  const ex = currentData.exercises[exIdx];
  const key = 'ex'+exIdx;
  let correct = 0, total = 0;
  ex.items.forEach(item => {
    if (item.given) return;
    total++;
    const inp = document.getElementById('wb_'+item.id);
    if (!inp) return;
    if (inp.value.trim().toLowerCase() === item.answer.toLowerCase()) {
      inp.classList.add('correct'); correct++;
    } else {
      inp.classList.add('wrong');
    }
    inp.disabled = true;
  });
  showResult(correct, total);
}

/* ── Type 2: Passage Fill ── */
function renderPassageFill(ex, exIdx, left, right) {
  const key = 'ex'+exIdx;
  if (!answers[key]) answers[key] = {};

  let html = '';
  ex.passages.forEach(p => {
    html += `<div class="passage-block"><div class="passage-header">${p.header}</div><div style="white-space:pre-wrap">`;
    p.parts.forEach(part => {
      if (part.text !== undefined) {
        html += escHtml(part.text);
      } else if (part.blank !== undefined) {
        const val = answers[key][part.blank] || '';
        html += `<span class="blank-num">(${part.num})</span><input class="ans-input" id="pf_${part.blank}" value="${escAttr(val)}" placeholder="..." style="width:100px" oninput="savePF('${key}','${part.blank}',this.value,${exIdx})">`;
      }
    });
    html += `</div></div>`;
  });

  left.innerHTML = `<div class="ex-instruction"><i class="fas fa-book-open"></i> ${ex.instruction}</div>${html}`;

  right.innerHTML = `
    <div style="font-weight:600;color:var(--turtle-dark);margin-bottom:.75rem"><i class="fas fa-th"></i> Ngân hàng từ</div>
    <div id="pfBank">${renderPFBank(ex.wordBank, answers[key])}</div>
    <button class="check-btn bounce" onclick="checkPF(${exIdx})"><i class="fas fa-check-circle"></i> Kiểm tra</button>`;
}

function renderPFBank(bank, ans) {
  const used = Object.values(ans).map(v => v.toLowerCase());
  return bank.map(w => {
    const u = used.includes(w.toLowerCase());
    return `<span class="wb-chip ${u?'used':''}" onclick="pickPF('${esc(w)}')">${w}</span>`;
  }).join('');
}

function pickPF(word) {
  const exIdx = getCurrentExIdx();
  const key = 'ex'+exIdx;
  const ex = currentData.exercises[exIdx];
  if (!answers[key]) answers[key] = {};

  for (const p of ex.passages) {
    for (const part of p.parts) {
      if (part.blank === undefined) continue;
      const inp = document.getElementById('pf_'+part.blank);
      if (inp && !inp.value.trim()) {
        inp.value = word;
        answers[key][part.blank] = word;
        document.getElementById('pfBank').innerHTML = renderPFBank(ex.wordBank, answers[key]);
        updateProgress(exIdx);
        return;
      }
    }
  }
}

function savePF(key, blank, val, exIdx) {
  if (!answers[key]) answers[key] = {};
  answers[key][blank] = val;
  const ex = currentData.exercises[exIdx];
  document.getElementById('pfBank').innerHTML = renderPFBank(ex.wordBank, answers[key]);
  updateProgress(exIdx);
}

function checkPF(exIdx) {
  const ex = currentData.exercises[exIdx];
  const key = 'ex'+exIdx;
  let correct = 0, total = 0;
  ex.passages.forEach(p => {
    p.parts.forEach(part => {
      if (part.blank === undefined) return;
      total++;
      const inp = document.getElementById('pf_'+part.blank);
      if (!inp) return;
      if (inp.value.trim().toLowerCase() === part.answer.toLowerCase()) {
        inp.classList.add('correct'); correct++;
      } else {
        inp.classList.add('wrong');
      }
      inp.disabled = true;
    });
  });
  showResult(correct, total);
}

/* ── Type 3: Drag Sort ── */
function renderDragSort(ex, exIdx, left, right) {
  const key = 'ex'+exIdx;
  if (!answers[key]) answers[key] = {};

  left.innerHTML = `
    <div class="ex-instruction"><i class="fas fa-arrows-alt"></i> ${ex.instruction}</div>
    <div style="display:flex;gap:1rem;flex:1">
      ${ex.categories.map((cat, ci) => `
        <div class="ds-cat">
          <div class="ds-cat-title">${cat}</div>
          <div class="ds-drop" id="dsDrop${ci}" data-cat="${ci}"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="dropWord(event,${ci},${exIdx})">
            ${getDropped(key, ci)}
          </div>
        </div>`).join('')}
    </div>`;

  const placed = Object.values(answers[key]).flat();
  right.innerHTML = `
    <div style="font-weight:600;color:var(--turtle-dark);margin-bottom:.75rem"><i class="fas fa-hand-pointer"></i> Kéo từ vào đúng cột</div>
    <div id="dsBank">
      ${shuffleOnce(ex.words, key).map(w => {
        const inP = placed.includes(w.word);
        return `<span class="ds-word ${inP?'used':''}" draggable="${!inP}" ondragstart="dragW(event,'${esc(w.word)}')" ${inP?'style="opacity:.3;pointer-events:none"':''}>${w.word}</span>`;
      }).join('')}
    </div>
    <button class="check-btn bounce" onclick="checkDS(${exIdx})" style="margin-top:auto"><i class="fas fa-check-circle"></i> Kiểm tra</button>`;
}

const _shuffled = {};
function shuffleOnce(words, key) {
  if (_shuffled[key]) return _shuffled[key];
  const arr = [...words];
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  _shuffled[key] = arr;
  return arr;
}

function getDropped(key, catIdx) {
  const words = (answers[key] && answers[key][catIdx]) || [];
  return words.map(w => `<span class="ds-word" style="cursor:pointer" onclick="removeDS('${key}',${catIdx},'${esc(w)}')">${w} <i class="fas fa-times" style="font-size:.7rem;opacity:.6"></i></span>`).join('');
}

function dragW(e, word) { e.dataTransfer.setData('text/plain', word); }

function dropWord(e, catIdx, exIdx) {
  e.preventDefault();
  const el = e.currentTarget || e.target.closest('.ds-drop');
  if (el) el.classList.remove('drag-over');
  const word = e.dataTransfer.getData('text/plain');
  const key = 'ex'+exIdx;
  if (!answers[key]) answers[key] = {};
  if (!answers[key][catIdx]) answers[key][catIdx] = [];
  if (!answers[key][catIdx].includes(word)) {
    const other = catIdx === 0 ? 1 : 0;
    if (answers[key][other]) answers[key][other] = answers[key][other].filter(w => w !== word);
    answers[key][catIdx].push(word);
  }
  renderExercise(getMat(), currentData, exIdx);
}

function removeDS(key, catIdx, word) {
  if (answers[key] && answers[key][catIdx]) {
    answers[key][catIdx] = answers[key][catIdx].filter(w => w !== word);
  }
  renderExercise(getMat(), currentData, getCurrentExIdx());
}

function checkDS(exIdx) {
  const ex = currentData.exercises[exIdx];
  const key = 'ex'+exIdx;
  let correct = 0;
  ex.words.forEach(w => {
    const placed = (answers[key] && answers[key][w.category]) || [];
    if (placed.includes(w.word)) correct++;
  });
  showResult(correct, ex.words.length);
}

/* ── Type 4: Image Type ── */
function renderImageType(ex, exIdx, left, right) {
  const key = 'ex'+exIdx;
  if (!answers[key]) answers[key] = {};

  left.innerHTML = `
    <div class="ex-instruction"><i class="fas fa-images"></i> ${ex.instruction}</div>
    ${ex.items.map(item => {
      const pVal = item.given ? item.present : (answers[key][item.id+'_p'] || '');
      const pastVal = item.given ? item.past : (answers[key][item.id+'_past'] || '');
      return `
      <div class="it-card">
        <img src="${item.img}" alt="">
        <div class="it-labels">
          <div class="it-row">
            <span>Now:</span>
            ${item.given
              ? `<input class="ans-input given" value="${item.present}" disabled>`
              : `<input class="ans-input" id="it_${item.id}_p" value="${escAttr(pVal)}" placeholder="..." oninput="saveIT('${key}','${item.id}_p',this.value,${exIdx})">`}
          </div>
          <div class="it-row">
            <span>Past:</span>
            ${item.given
              ? `<input class="ans-input given" value="${item.past}" disabled><span style="font-size:.75rem;color:#999;margin-left:.3rem">Mẫu</span>`
              : `<input class="ans-input" id="it_${item.id}_past" value="${escAttr(pastVal)}" placeholder="..." oninput="saveIT('${key}','${item.id}_past',this.value,${exIdx})">`}
          </div>
        </div>
      </div>`;
    }).join('')}`;

  right.innerHTML = `
    <div style="font-weight:600;color:var(--turtle-dark);margin-bottom:.75rem"><i class="fas fa-info-circle"></i> Hướng dẫn</div>
    <p style="color:#666;font-size:.9rem;line-height:1.6">Nhìn hình và viết dạng hiện tại (Now) và quá khứ (Past) của động từ.</p>
    <button class="check-btn bounce" onclick="checkIT(${exIdx})" style="margin-top:auto"><i class="fas fa-check-circle"></i> Kiểm tra</button>`;
}

function saveIT(key, field, val, exIdx) {
  if (!answers[key]) answers[key] = {};
  answers[key][field] = val;
  updateProgress(exIdx);
}

function checkIT(exIdx) {
  const ex = currentData.exercises[exIdx];
  const key = 'ex'+exIdx;
  let correct = 0, total = 0;
  ex.items.forEach(item => {
    if (item.given) return;
    total += 2;
    const pInp = document.getElementById('it_'+item.id+'_p');
    const pastInp = document.getElementById('it_'+item.id+'_past');
    if (pInp) {
      if (pInp.value.trim().toLowerCase() === item.present.toLowerCase()) { pInp.classList.add('correct'); correct++; }
      else pInp.classList.add('wrong');
      pInp.disabled = true;
    }
    if (pastInp) {
      if (pastInp.value.trim().toLowerCase() === item.past.toLowerCase()) { pastInp.classList.add('correct'); correct++; }
      else pastInp.classList.add('wrong');
      pastInp.disabled = true;
    }
  });
  showResult(correct, total);
}

/* ── Type 5: Story Type ── */
function renderStoryType(ex, exIdx, left, right) {
  const key = 'ex'+exIdx;
  if (!answers[key]) answers[key] = {};

  left.innerHTML = `
    <div class="ex-instruction"><i class="fas fa-book-reader"></i> ${ex.instruction}</div>
    <div class="st-context">${ex.context}</div>
    ${ex.items.map(item => {
      const sel = answers[key][item.id] || '';
      return `
      <div class="st-item">
        <span class="st-num">${item.num}.</span>
        <span>${item.before}</span>
        ${item.options.map(opt =>
          `<span class="st-opt ${sel===opt?'selected':''}" onclick="pickST('${key}','${item.id}','${esc(opt)}',${exIdx})">${opt}</span>`
        ).join('')}
        <span>${item.after}</span>
      </div>`;
    }).join('')}`;

  right.innerHTML = `
    <div style="font-weight:600;color:var(--turtle-dark);margin-bottom:.75rem"><i class="fas fa-info-circle"></i> Hướng dẫn</div>
    <p style="color:#666;font-size:.9rem;line-height:1.6">Đọc đoạn văn, chọn từ đúng và điền vào chỗ trống.</p>
    <button class="check-btn bounce" onclick="checkST(${exIdx})" style="margin-top:auto"><i class="fas fa-check-circle"></i> Kiểm tra</button>`;
}

function pickST(key, itemId, opt, exIdx) {
  if (!answers[key]) answers[key] = {};
  answers[key][itemId] = opt;
  renderExercise(getMat(), currentData, exIdx);
}

function checkST(exIdx) {
  const ex = currentData.exercises[exIdx];
  const key = 'ex'+exIdx;
  let correct = 0;
  ex.items.forEach((item, i) => {
    const sel = (answers[key] && answers[key][item.id]) || '';
    const row = document.querySelectorAll('.st-item')[i];
    if (!row) return;
    row.querySelectorAll('.st-opt').forEach(el => {
      const w = el.textContent.trim();
      if (w === item.answer) el.classList.add('correct');
      else if (w === sel && sel !== item.answer) el.classList.add('wrong');
      el.style.pointerEvents = 'none';
    });
    if (sel.toLowerCase() === item.answer.toLowerCase()) correct++;
  });
  showResult(correct, ex.items.length);
}

/* ── Helpers ── */
function getCurrentExIdx() {
  const dots = document.querySelectorAll('.q-dot');
  for (let i = 0; i < dots.length; i++) {
    if (dots[i].classList.contains('active')) return i;
  }
  return 0;
}

function countQuestions(ex) {
  switch(ex.type) {
    case 'word-bank-fill': return ex.items.filter(i=>!i.given).length;
    case 'passage-fill': return ex.passages.reduce((s,p) => s + p.parts.filter(pt=>pt.blank!==undefined).length, 0);
    case 'drag-sort': return ex.words.length;
    case 'image-type': return ex.items.filter(i=>!i.given).length * 2;
    case 'story-type': return ex.items.length;
    default: return 0;
  }
}

function countAnswered(ex, exIdx) {
  const key = 'ex'+exIdx;
  const ans = answers[key] || {};
  switch(ex.type) {
    case 'word-bank-fill': return Object.keys(ans).filter(k => ans[k].trim()).length;
    case 'passage-fill': return Object.keys(ans).filter(k => ans[k].trim()).length;
    case 'drag-sort': return Object.values(ans).flat().length;
    case 'image-type': return Object.keys(ans).filter(k => ans[k].trim()).length;
    case 'story-type': return Object.keys(ans).filter(k => ans[k]).length;
    default: return 0;
  }
}

function isExDone(ex, exIdx) {
  return countAnswered(ex, exIdx) >= countQuestions(ex) && countQuestions(ex) > 0;
}

function updateProgress(exIdx) {
  const ex = currentData.exercises[exIdx];
  const pct = countQuestions(ex) ? Math.round(countAnswered(ex, exIdx)/countQuestions(ex)*100) : 0;
  const bar = document.querySelector('.ex-progress-fill');
  if (bar) bar.style.width = pct + '%';
  const dot = document.querySelectorAll('.q-dot')[exIdx];
  if (dot) {
    if (isExDone(ex, exIdx)) dot.classList.add('done');
    else dot.classList.remove('done');
  }
}

function showResult(correct, total) {
  const pct = total ? Math.round(correct/total*100) : 0;
  let icon = 'success', title = 'Xuất sắc!';
  if (pct < 50) { icon = 'error'; title = 'Cố gắng hơn nhé!'; }
  else if (pct < 80) { icon = 'warning'; title = 'Khá tốt!'; }
  Swal.fire({
    icon, title,
    html: `<div style="font-size:1.3rem;font-weight:700;color:var(--turtle)">${correct}/${total}</div><p style="color:#888;margin-top:.5rem">${pct}% đúng</p>`,
    confirmButtonColor: '#20a1a0',
    confirmButtonText: 'OK'
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function esc(s) {
  return s.replace(/'/g,"\\'");
}

window.addEventListener('hashchange', router);
window.addEventListener('load', router);
</script>
