<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Language Material</title>
    
    <!-- Tailwind CSS cho thiết kế responsive và UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome cho icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 để thay thế alert() mặc định, tạo thông báo đẹp mắt -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Màu Blue Turtle nhẹ nhàng, thanh lịch
                        'turtle': {
                            50: '#f0fbfa',
                            100: '#ccf2ef',
                            200: '#99e4df',
                            300: '#66d3cc',
                            400: '#3fbcba',
                            500: '#20a1a0', // Main Blue Turtle color
                            600: '#178082',
                            700: '#136768',
                            800: '#115254',
                            900: '#0f4446',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(32, 161, 160, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        
        /* Hiệu ứng nảy nhẹ khi hover cho các tương tác */
        .hover-bounce {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .hover-bounce:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(32, 161, 160, 0.2), 0 10px 10px -5px rgba(32, 161, 160, 0.1);
        }

        /* Ẩn hiện các view để tạo ứng dụng Single Page (SPA) */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .material-card .card-bg-decor { background-color: var(--theme-color); opacity: 0.1; }
        .material-card .card-icon { background-color: var(--theme-bg-color); color: var(--theme-color); }
        .material-card:hover .card-icon { background-color: var(--theme-color) !important; color: white !important; }
        .material-card:hover .card-title { color: var(--theme-color); }
        
        .detail-decor { background-color: var(--theme-color); opacity: 0.15; }
        .detail-icon { background-color: var(--theme-bg-color); color: var(--theme-color); }

        /* Desktop: scale exercise text for young learners */
        @media (min-width: 768px) {
            #dynamic-content-container { font-size: 1.3rem; }
            #dynamic-content-container .text-sm  { font-size: 1.2rem !important; }
            #dynamic-content-container .text-xs  { font-size: 1.05rem !important; }
            #dynamic-content-container .text-base { font-size: 1.35rem !important; }
            #dynamic-content-container p          { font-size: 1.2rem; line-height: 2rem; }
            #dynamic-content-container input[type="text"] { font-size: 1.15rem !important; width: 9.5rem !important; min-height: 2.5rem; }
            #dynamic-content-container button.wb-chip,
            #dynamic-content-container button.pf-chip,
            #dynamic-content-container .drag-word { font-size: 1.1rem !important; padding: 0.5rem 1rem !important; }
            #dynamic-content-container h3 { font-size: 1.25rem !important; }
        }

        /* Full-screen exercise mode on desktop */
        @media (min-width: 768px) {
            body.has-exercise main {
                max-width: 100% !important;
                padding: 0 !important;
            }
            body.has-exercise #view-detail {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            body.has-exercise #view-detail > div.bg-white {
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 0.5rem 1.25rem 1.5rem !important;
                overflow: visible !important;
            }
        }

        /* Three-column exercise layout */
        .ex-three-panel { display: flex; flex-direction: column; gap: 0.75rem; }
        /* mobile: hide empty nav/wb cols */
        .ex-nav-col:empty, .ex-wb-col:empty { display: none; }
        @media (min-width: 768px) {
            .ex-three-panel { flex-direction: row; align-items: flex-start; gap: 1rem; }
            .ex-nav-col   { flex: 0 0 3.25rem; max-width: 3.25rem; position: sticky; top: 4.75rem; align-self: flex-start; }
            .ex-wb-col    { flex: 0 0 170px;   max-width: 170px;   position: sticky; top: 4.75rem; align-self: flex-start; }
            .ex-main-col  { flex: 1; min-width: 0; }
            .ex-nav-col:empty { display: block; } /* keep column width on desktop */
            .ex-wb-col:empty  { display: block; }
        }

        /* Item card: image left, input right */
        .ex-item-row { display: flex; flex-direction: column; gap: 0; overflow: hidden; border-radius: 1rem; }
        @media (min-width: 640px) {
            .ex-item-row { flex-direction: row; align-items: stretch; }
            .ex-item-row .ex-item-left  { flex: 0 0 48%; max-width: 48%; }
            .ex-item-row .ex-item-right { flex: 1; }
        }

        /* Scroll offset for sticky nav bar */
        .ex-item-anchor { scroll-margin-top: 5.5rem; }

        /* Navigator number button */
        .q-nav-btn {
            width: 2.75rem; height: 2.75rem; border-radius: 0.6rem;
            font-size: 0.9rem; font-weight: 700;
            border: 2px solid var(--theme-color);
            color: var(--theme-color);
            background: var(--theme-bg-color);
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .q-nav-btn:hover, .q-nav-btn.active {
            background: var(--theme-color); color: white;
        }

        /* Answer feedback shown below wrong input */
        .ans-hint {
            font-size: 0.85rem; color: #16a34a; font-weight: 700;
            margin-top: 0.25rem; display: none;
        }
        .ans-hint.visible { display: block; }

        /* === Overlay Exercise UI === */
        .ex-tabs-bar {
            display: flex; gap: 0.5rem; padding: 0.6rem 1rem;
            background: white; border-bottom: 1px solid #e2e8f0;
            overflow-x: auto; flex-shrink: 0; align-items: center;
        }
        .ex-tab-btn {
            padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.82rem; font-weight: 700;
            border: 2px solid var(--theme-color, #20a1a0); color: var(--theme-color, #20a1a0);
            background: transparent; cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
        }
        .ex-tab-active { background: var(--theme-color, #20a1a0); color: white; }
        .ex-body-row { flex: 1; display: flex; min-height: 0; }
        .ex-sidebar {
            width: 168px; flex-shrink: 0; background: white; border-right: 1px solid #e2e8f0;
            padding: 0.9rem 0.65rem; overflow-y: auto;
        }
        @media (max-width: 640px) { .ex-sidebar { width: 110px; } }
        .ex-sidebar-title {
            font-size: 0.65rem; font-weight: 800; color: var(--theme-color, #20a1a0);
            letter-spacing: 0.06em; margin-bottom: 0.65rem; text-align: center;
        }
        .ex-q-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; }
        @media (max-width: 640px) { .ex-q-grid { grid-template-columns: repeat(3, 1fr); } }
        .ex-q-btn {
            width: 100%; aspect-ratio: 1; border-radius: 50%; font-size: 0.75rem; font-weight: 700;
            border: 2px solid #cbd5e1; color: #64748b; background: white;
            cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
        }
        .ex-q-btn:hover { border-color: var(--theme-color, #20a1a0); color: var(--theme-color, #20a1a0); }
        .ex-q-current {
            border-color: var(--theme-color, #20a1a0); color: white;
            background: var(--theme-color, #20a1a0);
            box-shadow: 0 0 0 3px rgba(32,161,160,0.25);
        }
        .ex-q-answered {
            border-color: var(--theme-color, #20a1a0); color: var(--theme-color, #20a1a0);
            background: rgba(32,161,160,0.12);
        }
        .ex-main-area {
            flex: 1; overflow-y: auto; padding: 1.25rem;
            display: flex; flex-direction: column; gap: 0.9rem;
        }
        .ex-qh { font-size: 1rem; font-weight: 800; color: var(--theme-color, #20a1a0); margin-bottom: 0.25rem; }
        .ex-qbody { display: flex; flex-direction: column; gap: 0.9rem; }
        .ex-bottom-bar {
            background: white; border-top: 1px solid #e2e8f0; padding: 0.65rem 1.25rem; flex-shrink: 0;
        }
        .ex-prog-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
        .ex-prog-text { font-size: 0.8rem; font-weight: 600; color: #64748b; white-space: nowrap; }
        .ex-prog-bar { flex: 1; height: 0.45rem; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .ex-prog-fill { height: 100%; background: var(--theme-color, #20a1a0); border-radius: 999px; transition: width 0.3s; }
        .ex-nav-row { display: flex; gap: 0.6rem; justify-content: center; }
        .ex-prev-btn, .ex-next-btn {
            padding: 0.55rem 1.25rem; border-radius: 0.7rem; font-weight: 700; font-size: 0.9rem;
            border: 2px solid var(--theme-color, #20a1a0); color: var(--theme-color, #20a1a0);
            background: white; cursor: pointer; transition: all 0.2s;
        }
        .ex-prev-btn:hover, .ex-next-btn:hover { background: var(--theme-color, #20a1a0); color: white; }
        .ex-submit-btn {
            padding: 0.55rem 1.75rem; border-radius: 0.7rem; font-weight: 800; font-size: 0.9rem;
            background: #f59e0b; color: white; border: none; cursor: pointer; transition: all 0.2s;
        }
        .ex-submit-btn:hover { background: #d97706; }

        /* Item image cards */
        .ex-img-card {
            display: flex; background: white; border-radius: 1rem; overflow: hidden;
            border: 2px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); min-height: 8.5rem;
        }
        @media (max-width: 640px) { .ex-img-card { flex-direction: column; min-height: 0; } }
        .ex-card-img { width: 33%; object-fit: cover; }
        @media (max-width: 640px) { .ex-card-img { width: 100%; min-height: 5.5rem; } }
        .ex-card-right {
            flex: 1; padding: 1.5rem; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0.65rem;
        }
        .ex-card-given { background: #f0fdf4; }
        .ex-given-word { font-size: 1.4rem; font-weight: 800; color: #16a34a; }
        .ex-given-badge {
            font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.7rem; border-radius: 999px;
            background: var(--theme-bg-color, rgba(32,161,160,0.1)); color: var(--theme-color, #20a1a0);
        }
        .ex-text-inp {
            width: 100%; text-align: center; font-size: 1.25rem; font-weight: 700;
            border: none; border-bottom: 3px solid; background: transparent; padding: 0.4rem; outline: none;
        }

        /* Word bank chips */
        .ex-bank-box { background: white; border-radius: 1rem; padding: 0.9rem; border: 1px solid #e2e8f0; }
        .ex-bank-label { font-size: 0.78rem; font-weight: 700; color: var(--theme-color, #20a1a0); margin-bottom: 0.45rem; }
        .ex-bank-chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
        .ex-chip-disp {
            padding: 0.3rem 0.75rem; border-radius: 0.55rem; font-weight: 600; font-size: 0.9rem;
            background: var(--theme-bg-color, rgba(32,161,160,0.1)); color: var(--theme-color, #20a1a0);
        }
        .ex-chip-btn {
            padding: 0.3rem 0.75rem; border-radius: 0.55rem; font-weight: 600; font-size: 0.9rem;
            border: 2px solid var(--theme-color, #20a1a0); color: var(--theme-color, #20a1a0);
            background: var(--theme-bg-color, rgba(32,161,160,0.1)); cursor: pointer; transition: all 0.15s;
        }
        .ex-chip-btn:hover { background: var(--theme-color, #20a1a0); color: white; }
        .ex-chip-used { opacity: 0.35; pointer-events: none; }
        .ex-chip-sel { background: var(--theme-color, #20a1a0) !important; color: white !important; box-shadow: 0 0 0 3px rgba(32,161,160,0.3); }

        /* Story type */
        .ex-st-ctx {
            background: #f8fafc; border-left: 4px solid var(--theme-color, #20a1a0);
            padding: 0.7rem 1rem; border-radius: 0 0.75rem 0.75rem 0;
            font-size: 0.95rem; color: #475569; font-style: italic;
        }
        .ex-st-sent {
            background: white; border-radius: 1rem; padding: 1.1rem 1.25rem;
            border: 2px solid #e2e8f0; font-size: 1.1rem; color: #1e293b; line-height: 2;
        }
        .ex-st-blank {
            font-weight: 800; color: var(--theme-color, #20a1a0);
            border-bottom: 2px solid var(--theme-color, #20a1a0); padding: 0 0.2rem;
        }
        .ex-st-opts { display: flex; flex-wrap: wrap; gap: 0.65rem; }
        .ex-st-opt {
            padding: 0.55rem 1.35rem; border-radius: 0.7rem; font-weight: 700; font-size: 1rem;
            border: 2px solid var(--theme-color, #20a1a0); color: var(--theme-color, #20a1a0);
            background: white; cursor: pointer; transition: all 0.2s;
        }
        .ex-st-opt:hover { background: var(--theme-color, #20a1a0); color: white; }
        .ex-st-sel { background: var(--theme-color, #20a1a0) !important; color: white !important; }

        /* Passage fill overlay */
        .ex-pass-card {
            background: white; border-radius: 1rem; padding: 1.1rem 1.25rem;
            border: 1px solid #e2e8f0; margin-bottom: 0.65rem;
        }
        .ex-pass-hdr { font-size: 0.82rem; font-weight: 700; color: var(--theme-color, #20a1a0); margin-bottom: 0.65rem; }
        .ex-pass-txt { font-size: 0.98rem; line-height: 2.2; color: #334155; }
        .pf-inp-ov {
            display: inline-block; border: none; border-bottom: 2px solid; background: transparent;
            text-align: center; font-weight: 700; width: 5rem; margin: 0 0.2rem;
            font-size: 0.98rem; outline: none; cursor: text;
        }

        /* Drag sort */
        .ex-sort-wrap { display: flex; flex-direction: column; gap: 0.9rem; }
        @media (min-width: 640px) { .ex-sort-wrap { flex-direction: row; align-items: flex-start; } }
        .ex-sort-pool { flex: 0 0 180px; background: white; border-radius: 1rem; padding: 0.9rem; border: 1px solid #e2e8f0; }
        .ex-sort-words { display: flex; flex-wrap: wrap; gap: 0.45rem; }
        .ex-drag-word {
            padding: 0.35rem 0.75rem; border-radius: 0.55rem; font-weight: 600; font-size: 0.9rem;
            border: 2px solid var(--theme-color, #20a1a0); color: var(--theme-color, #20a1a0);
            background: var(--theme-bg-color, rgba(32,161,160,0.1)); cursor: grab; user-select: none;
        }
        .ex-drag-placed { opacity: 0.35; }
        .ex-sort-zones { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
        .drop-zone-ov {
            min-height: 9rem; border-radius: 1rem; padding: 0.9rem;
            border: 2px dashed var(--theme-color, #20a1a0); background: white; transition: background 0.15s;
        }
        .drop-zone-ov.drag-over { background: rgba(32,161,160,0.07); }
        .ex-zone-lbl { font-size: 0.82rem; font-weight: 700; color: var(--theme-color, #20a1a0); margin-bottom: 0.5rem; text-align: center; }
        .ex-zone-items { display: flex; flex-direction: column; gap: 0.3rem; }
        .ex-placed-tag {
            padding: 0.3rem 0.7rem; border-radius: 0.5rem; font-size: 0.88rem; font-weight: 600;
            background: var(--theme-bg-color, rgba(32,161,160,0.1)); color: var(--theme-color, #20a1a0);
            cursor: pointer; text-align: center; transition: all 0.15s;
        }
        .ex-placed-tag:hover { background: #fee2e2; color: #dc2626; }
    </style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col">

    <!-- Navbar chung (sẽ ẩn ở màn hình đăng nhập) -->
    <nav id="main-nav" class="bg-white shadow-sm px-6 py-4 hidden sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 text-turtle-600 font-bold text-xl cursor-pointer hover-bounce" onclick="window.location.hash='#/dashboard'">
                <div class="bg-turtle-100 p-2 rounded-xl text-turtle-600">
                    <i class="fa-solid fa-earth-americas"></i>
                </div>
                <span>ELM Portal</span>
            </div>
            <div>
                <button id="logout-btn" class="text-slate-500 hover:text-turtle-600 font-medium px-4 py-2 rounded-xl hover:bg-turtle-50 transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col p-4 sm:p-6 w-full max-w-6xl mx-auto">
        
        <!-- VIEW 1: ĐĂNG NHẬP -->
        <section id="view-login" class="view-section active m-auto w-full max-w-md">
            <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-soft text-center hover-bounce">
                <div class="w-20 h-20 bg-turtle-100 rounded-3xl flex items-center justify-center mx-auto mb-6 text-turtle-500 text-4xl shadow-sm rotate-3 hover:rotate-0 transition-transform">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">ENGLISH LANGUAGE MATERIAL</h1>
                <p class="text-slate-500 text-sm mb-8">Dành riêng cho giáo viên. Vui lòng nhập mã truy cập.</p>
                
                <form id="login-form" class="space-y-6">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="teacher-code" placeholder="Nhập mã giáo viên"
                            class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-turtle-400 focus:bg-white transition-all shadow-inner font-medium"
                            required>
                    </div>
                    
                    <button type="submit" 
                        class="w-full py-4 px-6 bg-turtle-500 text-white font-bold rounded-2xl hover:bg-turtle-600 active:scale-95 transition-all shadow-lg shadow-turtle-500/30 flex items-center justify-center gap-2">
                        <span>Truy cập hệ thống</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </section>

        <!-- VIEW 2: DANH SÁCH TÀI LIỆU (DASHBOARD) -->
        <section id="view-dashboard" class="view-section w-full py-6">
            <div class="mb-10 text-center sm:text-left">
                <h2 class="text-3xl font-bold text-slate-800 mb-3">Tài liệu Giảng dạy</h2>
                <p class="text-slate-500">Chọn một học phần để xem chi tiết và giao bài tập cho học sinh.</p>
            </div>
            
            <!-- Vùng chứa danh sách Grid -->
            <div id="materials-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Nội dung được render bằng JavaScript tự động -->
            </div>
        </section>

        <!-- VIEW 3: CHI TIẾT TÀI LIỆU (MÀN HÌNH BÀI TẬP CÓ LINK RIÊNG) -->
        <section id="view-detail" class="view-section w-full py-6 max-w-4xl mx-auto">
            
            <button id="back-btn" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-slate-800 transition-colors font-medium w-fit hover-bounce">
                <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
            </button>

            <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-soft relative overflow-hidden">
                <!-- Decoration background -->
                <div class="absolute -top-16 -right-16 w-32 h-32 rounded-full blur-2xl detail-decor transition-colors duration-500"></div>
                
                <div class="relative z-10 flex flex-col md:flex-row gap-8 items-start md:items-center justify-between mb-8 pb-8 border-b border-slate-100">
                    <div class="flex items-center gap-5">
                        <div>
                            <h2 id="detail-title" class="text-2xl sm:text-3xl font-bold text-slate-800">Tên bài học</h2>
                            <p id="detail-subtitle" class="font-medium mt-1" style="color: var(--theme-color);">Bài tập thực hành</p>
                        </div>
                    </div>
                    
                    <!-- Nút Copy Link dành cho giáo viên (Học sinh sẽ không thấy nút này) -->
                    <div id="teacher-tools" class="w-full md:w-auto hidden">
                        <button onclick="copyCurrentLink()" class="w-full md:w-auto py-3 px-6 bg-slate-50 hover:bg-slate-800 hover:text-white border border-slate-200 font-semibold rounded-2xl transition-all flex items-center justify-center gap-2 shadow-sm hover-bounce" style="color: var(--theme-color);">
                            <i class="fa-solid fa-link"></i>
                            <span>Copy Link Giao Bài</span>
                        </button>
                    </div>
                </div>

                <!-- Vùng chứa nội dung động (Thư mục con hoặc Bài tập) -->
                <div id="dynamic-content-container" class="relative z-10">
                    <!-- Rendered by JS tự động -->
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- Dữ liệu các cấp độ học (Materials) dựa trên yêu cầu ---
        const materialsData = [

                { id: 'animals', name: 'Animals' },

                { id: 'people', name: 'People' },

                { id: 'the-home', name: 'The Home' },

        ];

        // Mật khẩu giáo viên cố định theo yêu cầu
        const TEACHER_CODE = '123';
        
        // Kiểm tra xem giáo viên đã đăng nhập từ trước chưa (Lưu session)
        let isLoggedIn = sessionStorage.getItem('elm_teacher_logged_in') === 'true';

        const viewLogin = document.getElementById('view-login');

        // --- Render UI Dashboard (Danh sách khóa học) ---
        function renderDashboard() {
            const grid = document.getElementById('materials-grid');

            materialsData.forEach(mat => {
                // Tạo mã màu bg với opacity

                // Thêm thuộc tính aspect-square và flex-col để tạo hình vuông bo góc, chữ căn giữa

                    <a href="#/material/${mat.id}" class="material-card aspect-square flex flex-col justify-center items-center text-center group block bg-white rounded-3xl p-6 border border-slate-100 hover-bounce cursor-pointer relative overflow-hidden shadow-sm" style="--theme-color: ${mat.color}; --theme-bg-color: ${bgColorWithOpacity};">

        // --- Render UI Chi tiết Bài Học & Thư mục ---
        function renderDetail(pathString) {
            const pathParts = pathString.split('/');
            const materialId = pathParts[0];
            const folderId = pathParts[1];
            const topicId = pathParts[2];

            const material = materialsData.find(m => m.id === materialId);

            if (!material) {
                Swal.fire('Lỗi', 'Không tìm thấy tài liệu này!', 'error')
                    .then(() => window.location.hash = '#/dashboard');
                return;
            }

            const viewDetail = document.getElementById('view-detail');
            viewDetail.style.setProperty('--theme-color', material.color);
            viewDetail.style.setProperty('--theme-bg-color', material.color + '25');

            let titleText = material.name;
            let subtitleText = 'Danh sách thư mục';
            let isShowingQuiz = false;

            const container = document.getElementById('dynamic-content-container');
            const backBtn = document.getElementById('back-btn');
            container.innerHTML = '';

            // Nút Quay lại theo cấp
            if (topicId) {
                backBtn.onclick = () => window.location.hash = `#/material/${materialId}/${folderId}`;
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Quay lại thư mục';
            } else if (folderId) {
                backBtn.onclick = () => window.location.hash = `#/material/${materialId}`;
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Quay lại thư mục';
            } else {
                backBtn.onclick = () => window.location.hash = '#/dashboard';
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Quay lại danh sách';
            }

            if (topicId) {
                // Cấp 3: load bài tập từ JSON
                const folder = material.folders?.find(f => f.id === folderId);
                const topic = folder?.topics?.find(t => t.id === topicId);
                if (topic) {
                    titleText = `${material.name} / ${folder.name} / ${topic.name}`;
                    subtitleText = 'Bài tập thực hành';
                }
                document.getElementById('detail-title').innerText = titleText;
                document.getElementById('detail-subtitle').innerText = subtitleText;
                const teacherTools = document.getElementById('teacher-tools');
                if (isLoggedIn) { teacherTools.classList.remove('hidden'); backBtn.style.display = 'flex'; }
                else { teacherTools.classList.add('hidden'); backBtn.style.display = 'none'; }
                loadExercisesFromJson(`data/${materialId}/${folderId}/${topicId}.json`, container);
                return;
            } else if (folderId) {
                const folder = material.folders?.find(f => f.id === folderId);
                if (folder) {
                    if (folder.topics && folder.topics.length > 0) {
                        // Cấp 2: folder có topics -> hiện danh sách topics
                        titleText = `${material.name} / ${folder.name}`;
                        subtitleText = 'Chọn chủ đề';
                        let topicsHtml = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">';
                        folder.topics.forEach(t => {
                            topicsHtml += `
                                <a href="#/material/${material.id}/${folder.id}/${t.id}" class="aspect-square bg-white rounded-3xl p-4 border border-slate-100 shadow-sm hover-bounce flex flex-col items-center justify-center text-center cursor-pointer group" style="background-color: var(--theme-bg-color);">
                                    <i class="fa-solid fa-book text-3xl mb-2 opacity-80" style="color: var(--theme-color);"></i>
                                    <span class="text-sm sm:text-base font-bold transition-transform group-hover:scale-105 leading-tight" style="color: var(--theme-color);">${t.name}</span>
                                </a>
                            `;
                        });
                        topicsHtml += '</div>';
                        container.innerHTML = topicsHtml;
                    } else {
                        // Cấp 2: folder không có topics -> load JSON
                        titleText = `${material.name} / ${folder.name}`;
                        subtitleText = 'Bài tập thực hành';
                        document.getElementById('detail-title').innerText = titleText;
                        document.getElementById('detail-subtitle').innerText = subtitleText;
                        const teacherTools = document.getElementById('teacher-tools');
                        if (isLoggedIn) { teacherTools.classList.remove('hidden'); backBtn.style.display = 'flex'; }
                        else { teacherTools.classList.add('hidden'); backBtn.style.display = 'none'; }
                        loadExercisesFromJson(`data/${materialId}/${folderId}.json`, container);
                        return;
                    }
                }
            } else if (!material.folders || material.folders.length === 0) {
                // Không có folder -> load JSON trực tiếp
                subtitleText = 'Bài tập thực hành';
                document.getElementById('detail-title').innerText = titleText;
                document.getElementById('detail-subtitle').innerText = subtitleText;
                const teacherTools = document.getElementById('teacher-tools');
                if (isLoggedIn) { teacherTools.classList.remove('hidden'); backBtn.style.display = 'flex'; }
                else { teacherTools.classList.add('hidden'); backBtn.style.display = 'none'; }
                loadExercisesFromJson(`data/${materialId}.json`, container);
                return;
            } else {
                // Cấp 1: hiện danh sách folders
                let foldersHtml = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">';
                material.folders.forEach(f => {
                    foldersHtml += `
                        <a href="#/material/${material.id}/${f.id}" class="aspect-square bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover-bounce flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group" style="background-color: var(--theme-bg-color);">
                            <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-80" style="color: var(--theme-color);"></i>
                            <span class="relative z-10 text-lg sm:text-xl font-bold transition-transform group-hover:scale-105" style="color: var(--theme-color);">${f.name}</span>
                        </a>
                    `;
                });
                foldersHtml += '</div>';
                container.innerHTML = foldersHtml;
            }

            document.getElementById('detail-title').innerText = titleText;
            document.getElementById('detail-subtitle').innerText = subtitleText;
            
            // Xử lý quyền hiển thị nút:
            const teacherTools = document.getElementById('teacher-tools');
            
            if (isLoggedIn) {
                // Là giáo viên -> Hiển thị nút copy link và nút quay lại dashboard
                teacherTools.classList.remove('hidden');
                backBtn.style.display = 'flex';
            } else {
                // Là học sinh (Truy cập trực tiếp qua link) -> Ẩn công cụ giáo viên và nút quay lại
                teacherTools.classList.add('hidden');
                backBtn.style.display = 'none'; 
            }
        }

        // --- Load bài tập từ file JSON ---
        async function loadExercisesFromJson(jsonPath, container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-4xl mb-4" style="color: var(--theme-color);"></i>
                    <p class="font-medium">Đang tải dữ liệu...</p>
                </div>
            `;
            try {
                const res = await fetch(jsonPath);
                if (!res.ok) throw new Error('not found');
                const data = await res.json();
                if (!data || !data.exercises || data.exercises.length === 0) throw new Error('empty');
                renderExercises(data, container);
            } catch (e) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                        <div class="w-20 h-20 rounded-3xl flex items-center justify-center mb-5 text-4xl" style="background-color: var(--theme-bg-color); color: var(--theme-color);">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-600 mb-2">Chưa có dữ liệu</h3>
                        <p class="text-sm text-slate-400 text-center max-w-xs">Bài tập cho chủ đề này đang được chuẩn bị. Vui lòng quay lại sau.</p>
                    </div>
                `;
            }
        }

        // --- Render bài tập từ dữ liệu JSON ---
        let _exData = null, _exIdx = 0, _itemIdx = 0, _answers = {}, _pfOvSel = null;

        function getExItems(ex) {
            if (ex.type === 'word-bank-fill' || ex.type === 'image-type' || ex.type === 'story-type') return ex.items;
            return [{ id: '__full__' }];
        }

        function renderExercises(data, container) {
            _exData = data; _exIdx = 0; _itemIdx = 0; _answers = {}; _pfOvSel = null;
            document.body.classList.add('has-exercise');
            document.getElementById('exov')?.remove();
            const nav = document.getElementById('main-nav');
            const navH = nav ? nav.offsetHeight : 0;
            const detail = document.getElementById('view-detail');
            const tc = detail ? getComputedStyle(detail).getPropertyValue('--theme-color').trim() : '#20a1a0';
            const tb = detail ? getComputedStyle(detail).getPropertyValue('--theme-bg-color').trim() : 'rgba(32,161,160,0.1)';
            const ov = document.createElement('div');
            ov.id = 'exov';
            ov.style.cssText = `position:fixed;left:0;right:0;top:${navH}px;bottom:0;z-index:200;display:flex;flex-direction:column;background:#f1f5f9;`;
            ov.style.setProperty('--theme-color', tc);
            ov.style.setProperty('--theme-bg-color', tb);
            ov.innerHTML = `
                <div id="ex-tabs" class="ex-tabs-bar"></div>
                <div class="ex-body-row">
                    <div id="ex-sidebar" class="ex-sidebar"></div>
                    <div id="ex-main" class="ex-main-area"></div>
                </div>
                <div id="ex-bottom" class="ex-bottom-bar"></div>`;
            document.body.appendChild(ov);
            renderExTabs(); renderExSidebar(); renderExMain(); renderExBottom();
        }

        function renderExTabs() {
            const el = document.getElementById('ex-tabs');
            if (!el || !_exData) return;
            el.innerHTML = _exData.exercises.map((ex, i) =>
                `<button class="ex-tab-btn${i===_exIdx?' ex-tab-active':''}" onclick="exGoExercise(${i})">${ex.title}</button>`
            ).join('');
        }

        function renderExSidebar() {
            const el = document.getElementById('ex-sidebar');
            if (!el || !_exData) return;
            const ex = _exData.exercises[_exIdx];
            const items = getExItems(ex);
            const btns = items.map((item, i) => {
                const answered = isItemAnswered(ex, item);
                const cur = i === _itemIdx;
                let cls = 'ex-q-btn';
                if (cur) cls += ' ex-q-current';
                else if (answered) cls += ' ex-q-answered';
                return `<button class="${cls}" onclick="exGoItem(${i})">${i+1}</button>`;
            }).join('');
            el.innerHTML = `<p class="ex-sidebar-title">BẢNG CÂU HỎI</p><div class="ex-q-grid">${btns}</div>`;
        }

        function isItemAnswered(ex, item) {
            if (item.given) return true;
            if (item.id === '__full__') {
                if (ex.type === 'passage-fill') return ex.passages?.some(p => p.parts.some(pt => pt.blank && _answers[`${ex.id}-${pt.blank}`]));
                if (ex.type === 'drag-sort') return ex.words?.some((w,i) => _answers[`${ex.id}-sort-${i}`] !== undefined);
                return false;
            }
            if (ex.type === 'word-bank-fill') return !!_answers[`${ex.id}-${item.id}`];
            if (ex.type === 'image-type') return !!_answers[`${ex.id}-${item.id}-present`] || !!_answers[`${ex.id}-${item.id}-past`];
            if (ex.type === 'story-type') return !!_answers[`${ex.id}-${item.id}`];
            return false;
        }

        function getGlobalNum() {
            if (!_exData) return 1;
            let n = 0;
            for (let i = 0; i < _exIdx; i++) n += getExItems(_exData.exercises[i]).length;
            return n + _itemIdx + 1;
        }
        function getGlobalTotal() {
            if (!_exData) return 1;
            return _exData.exercises.reduce((s,ex) => s + getExItems(ex).length, 0);
        }
        function countAnswered() {
            if (!_exData) return 0;
            let c = 0;
            _exData.exercises.forEach(ex => getExItems(ex).forEach(item => { if (isItemAnswered(ex, item)) c++; }));
            return c;
        }

        function renderExMain() {
            const el = document.getElementById('ex-main');
            if (!el || !_exData) return;
            const ex = _exData.exercises[_exIdx];
            const items = getExItems(ex);
            const item = items[_itemIdx];
            let qHtml = '';
            if (item.id === '__full__') {
                if (ex.type === 'passage-fill') qHtml = renderPassageOv(ex);
                else if (ex.type === 'drag-sort') qHtml = renderSortOv(ex);
            } else if (ex.type === 'word-bank-fill') {
                qHtml = renderWbfOv(ex, item);
            } else if (ex.type === 'image-type') {
                qHtml = renderItOv(ex, item);
            } else if (ex.type === 'story-type') {
                qHtml = renderStOv(ex, item);
            }
            el.innerHTML = `<div class="ex-qh">CÂU HỎI ${getGlobalNum()} / ${getGlobalTotal()}</div><div class="ex-qbody">${qHtml}</div>`;
            el.scrollTop = 0;
            attachItemListeners(ex, item);
        }

        function renderExBottom() {
            const el = document.getElementById('ex-bottom');
            if (!el) return;
            const total = getGlobalTotal(), answered = countAnswered();
            const pct = total > 0 ? Math.round(answered / total * 100) : 0;
            el.innerHTML = `
                <div class="ex-prog-row">
                    <span class="ex-prog-text">Tiến độ: ${answered}/${total} câu (${pct}%)</span>
                    <div class="ex-prog-bar"><div class="ex-prog-fill" style="width:${pct}%"></div></div>
                </div>
                <div class="ex-nav-row">
                    <button class="ex-prev-btn" onclick="exGoPrev()">← CÂU TRƯỚC</button>
                    <button class="ex-submit-btn" onclick="submitAll()">NỘP BÀI</button>
                    <button class="ex-next-btn" onclick="exGoNext()">CÂU TIẾP →</button>
                </div>`;
        }

        function exGoExercise(idx) {
            if (!_exData || idx < 0 || idx >= _exData.exercises.length) return;
            _exIdx = idx; _itemIdx = 0; _pfOvSel = null;
            renderExTabs(); renderExSidebar(); renderExMain(); renderExBottom();
        }
        function exGoItem(idx) {
            if (!_exData) return;
            const items = getExItems(_exData.exercises[_exIdx]);
            if (idx < 0 || idx >= items.length) return;
            _itemIdx = idx;
            renderExSidebar(); renderExMain(); renderExBottom();
        }
        function exGoNext() {
            if (!_exData) return;
            const items = getExItems(_exData.exercises[_exIdx]);
            if (_itemIdx < items.length - 1) exGoItem(_itemIdx + 1);
            else if (_exIdx < _exData.exercises.length - 1) exGoExercise(_exIdx + 1);
        }
        function exGoPrev() {
            if (!_exData) return;
            if (_itemIdx > 0) { exGoItem(_itemIdx - 1); }
            else if (_exIdx > 0) {
                const prevEx = _exData.exercises[_exIdx - 1];
                _exIdx--; _itemIdx = getExItems(prevEx).length - 1; _pfOvSel = null;
                renderExTabs(); renderExSidebar(); renderExMain(); renderExBottom();
            }
        }
        function saveAnswer(key, value) {
            if (value === '' || value === null || value === undefined) delete _answers[key];
            else _answers[key] = value;
            renderExSidebar(); renderExBottom();
        }

        // === Single-item renderers ===
        function renderWbfOv(ex, item) {
            if (!ex._shuffledBank) ex._shuffledBank = [...(ex.wordBank||[])].sort(() => Math.random()-0.5);
            const bank = ex._shuffledBank;
            if (item.given) {
                return `<div class="ex-img-card"><img src="${item.img}" class="ex-card-img">
                    <div class="ex-card-right ex-card-given">
                        <span class="ex-given-word">${item.answer}</span>
                        <span class="ex-given-badge">Mẫu</span>
                    </div></div>
                    <div class="ex-bank-box"><p class="ex-bank-label">Từ gợi ý</p>
                    <div class="ex-bank-chips">${bank.map(w=>`<span class="ex-chip-disp">${w}</span>`).join('')}</div></div>`;
            }
            const key = `${ex.id}-${item.id}`, val = _answers[key]||'';
            const esc = s => s.replace(/'/g, "\\'");
            return `<div class="ex-img-card"><img src="${item.img}" class="ex-card-img">
                <div class="ex-card-right">
                    <input type="text" class="ex-text-inp" value="${val}" placeholder="✏️ Nhập từ..."
                        oninput="saveAnswer('${esc(key)}',this.value)" style="border-color:var(--theme-color);">
                </div></div>
                <div class="ex-bank-box"><p class="ex-bank-label">Từ gợi ý — nhấn để điền</p>
                <div class="ex-bank-chips">${bank.map(w=>{
                    const used = val===w;
                    return `<button class="ex-chip-btn${used?' ex-chip-used':''}" onclick="wbChipClick('${esc(w)}','${esc(key)}')">${w}</button>`;
                }).join('')}</div></div>`;
        }
        function wbChipClick(word, key) {
            _answers[key] = word;
            renderExSidebar(); renderExMain(); renderExBottom();
        }

        function renderItOv(ex, item) {
            if (item.given) {
                return `<div class="ex-img-card"><img src="${item.img}" class="ex-card-img">
                    <div class="ex-card-right ex-card-given">
                        <p class="ex-given-word">${item.present}</p>
                        <p class="ex-given-word">${item.past}</p>
                        <span class="ex-given-badge">Mẫu</span>
                    </div></div>`;
            }
            const esc = s=>s.replace(/'/g,"\\'");
            const kp=`${ex.id}-${item.id}-present`, kq=`${ex.id}-${item.id}-past`;
            const vp=_answers[kp]||'', vq=_answers[kq]||'';
            return `<div class="ex-img-card"><img src="${item.img}" class="ex-card-img">
                <div class="ex-card-right" style="gap:1rem;">
                    <input type="text" class="ex-text-inp" value="${vp}" placeholder="✏️ Hiện tại..."
                        oninput="saveAnswer('${esc(kp)}',this.value)" style="border-color:var(--theme-color);">
                    <input type="text" class="ex-text-inp" value="${vq}" placeholder="✏️ Quá khứ..."
                        oninput="saveAnswer('${esc(kq)}',this.value)" style="border-color:var(--theme-color);">
                </div></div>`;
        }

        function renderStOv(ex, item) {
            const esc = s=>s.replace(/'/g,"\\'");
            const key=`${ex.id}-${item.id}`, val=_answers[key]||'';
            const opts = item.options.map(o=>{
                const sel = val===o;
                return `<button class="ex-st-opt${sel?' ex-st-sel':''}" onclick="stClick('${esc(o)}','${esc(key)}')">${o}</button>`;
            }).join('');
            return `<div class="ex-st-ctx">${ex.context}</div>
                <div class="ex-st-sent">${item.before} <span class="ex-st-blank">${val||'______'}</span> ${item.after}</div>
                <div class="ex-st-opts">${opts}</div>`;
        }
        function stClick(word, key) {
            _answers[key] = word;
            renderExSidebar(); renderExMain(); renderExBottom();
        }

        function renderPassageOv(ex) {
            const esc = s=>s.replace(/'/g,"\\'");
            const passHtml = ex.passages.map(p => {
                let txt = '';
                p.parts.forEach(part => {
                    if (part.text) txt += part.text.replace(/\n/g,'<br>');
                    else {
                        const key=`${ex.id}-${part.blank}`, val=_answers[key]||'';
                        txt += `<input type="text" class="pf-inp-ov" id="pf-${part.blank}" value="${val}" placeholder="${part.num}"
                            oninput="saveAnswer('${esc(key)}',this.value)" data-pfkey="${esc(key)}"
                            style="border-color:var(--theme-color);">`;
                    }
                });
                return `<div class="ex-pass-card"><p class="ex-pass-hdr">${p.header}</p><p class="ex-pass-txt">${txt}</p></div>`;
            }).join('');
            const chips = ex.wordBank.map(w => {
                const used = Object.values(_answers).includes(w);
                const isSel = _pfOvSel===w;
                return `<button class="ex-chip-btn${used?' ex-chip-used':''}${isSel?' ex-chip-sel':''}" onclick="pfChipClick('${esc(w)}','${ex.id}')">${w}</button>`;
            }).join('');
            return `<div class="ex-bank-box"><p class="ex-bank-label">Từ gợi ý — nhấn từ rồi nhấn ô trống</p><div class="ex-bank-chips">${chips}</div></div>${passHtml}`;
        }
        function pfChipClick(word, exId) {
            _pfOvSel = (_pfOvSel === word) ? null : word;
            renderExMain();
        }

        function renderSortOv(ex) {
            const esc = s=>s.replace(/'/g,"\\'");
            const words = ex.words.map((w,i) => {
                const placed = _answers[`${ex.id}-sort-${i}`] !== undefined;
                return `<div class="ex-drag-word${placed?' ex-drag-placed':''}" draggable="true"
                    data-ex="${ex.id}" data-idx="${i}" data-cat="${w.category}">${w.word}</div>`;
            }).join('');
            const mkZone = col => {
                const items = ex.words.map((w,i)=>({w,i})).filter(({i})=>_answers[`${ex.id}-sort-${i}`]===col)
                    .map(({w,i})=>`<div class="ex-placed-tag" onclick="removeSortAns('${esc(ex.id)}',${i})">${w.word}</div>`).join('');
                return `<div class="drop-zone-ov" data-ex="${ex.id}" data-col="${col}">
                    <p class="ex-zone-lbl">${ex.categories[col]}</p>
                    <div class="ex-zone-items">${items}</div></div>`;
            };
            return `<div class="ex-sort-wrap">
                <div class="ex-sort-pool"><p class="ex-bank-label">Các từ — kéo sang cột đúng</p><div class="ex-sort-words">${words}</div></div>
                <div class="ex-sort-zones">${mkZone(0)}${mkZone(1)}</div></div>`;
        }
        function removeSortAns(exId, idx) {
            delete _answers[`${exId}-sort-${idx}`];
            renderExSidebar(); renderExMain(); renderExBottom();
        }

        function attachItemListeners(ex, item) {
            if (ex.type === 'passage-fill') {
                document.querySelectorAll('.pf-inp-ov').forEach(inp => {
                    inp.addEventListener('click', function() {
                        if (_pfOvSel && !this.value) {
                            saveAnswer(this.dataset.pfkey, _pfOvSel);
                            _pfOvSel = null;
                            renderExMain();
                        }
                    });
                });
                return;
            }
            if (ex.type === 'drag-sort') {
                document.querySelectorAll('.ex-drag-word').forEach(word => {
                    word.addEventListener('dragstart', function(e) {
                        e.dataTransfer.setData('text/plain', JSON.stringify({
                            exId: this.dataset.ex, idx: this.dataset.idx, cat: this.dataset.cat, word: this.textContent.trim()
                        }));
                        this.style.opacity = '0.4';
                    });
                    word.addEventListener('dragend', function() { this.style.opacity = ''; });
                });
                document.querySelectorAll('.drop-zone-ov').forEach(zone => {
                    zone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
                    zone.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                    zone.addEventListener('drop', function(e) {
                        e.preventDefault(); this.classList.remove('drag-over');
                        let data; try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(err) { return; }
                        _answers[`${data.exId}-sort-${data.idx}`] = parseInt(this.dataset.col);
                        renderExSidebar(); renderExMain(); renderExBottom();
                    });
                });
            }
        }

        // === Submit / Check all answers ===
        function submitAll() {
            if (!_exData) return;
            let correct = 0, total = 0;
            _exData.exercises.forEach(ex => {
                if (ex.type === 'word-bank-fill') {
                    ex.items.filter(i=>!i.given).forEach(item => {
                        total++;
                        if ((_answers[`${ex.id}-${item.id}`]||'').trim().toLowerCase() === item.answer.trim().toLowerCase()) correct++;
                    });
                } else if (ex.type === 'image-type') {
                    ex.items.filter(i=>!i.given).forEach(item => {
                        total += 2;
                        if ((_answers[`${ex.id}-${item.id}-present`]||'').trim().toLowerCase() === item.present.trim().toLowerCase()) correct++;
                        if ((_answers[`${ex.id}-${item.id}-past`]||'').trim().toLowerCase() === item.past.trim().toLowerCase()) correct++;
                    });
                } else if (ex.type === 'story-type') {
                    ex.items.forEach(item => {
                        total++;
                        if (_answers[`${ex.id}-${item.id}`] === item.answer) correct++;
                    });
                } else if (ex.type === 'passage-fill') {
                    ex.passages.forEach(p => p.parts.filter(pt=>pt.blank).forEach(part => {
                        total++;
                        if ((_answers[`${ex.id}-${part.blank}`]||'').trim().toLowerCase() === part.answer.trim().toLowerCase()) correct++;
                    }));
                } else if (ex.type === 'drag-sort') {
                    ex.words.forEach((w,i) => {
                        total++;
                        if (_answers[`${ex.id}-sort-${i}`] === w.category) correct++;
                    });
                }
            });
            const pct = total > 0 ? Math.round(correct / total * 100) : 0;
            const stars = pct===100?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=40?'⭐':'';
            const msg = pct===100?'Tuyệt vời! Em đã trả lời đúng tất cả các câu! 🎊'
                :pct>=70?'Rất tốt! Em làm tốt lắm! 💪'
                :pct>=40?'Cố lên! Xem lại các câu sai nhé! 📚'
                :'Cố gắng thêm nhé! 🌱';
            Swal.fire({
                title: `${stars||'📝'} ${correct}/${total} câu đúng`,
                html: `<div style="font-size:1.1rem;margin-top:0.5rem;">${msg}</div>
                       <div style="font-size:2rem;margin-top:0.75rem;font-weight:bold;color:#20a1a0;">${pct}%</div>`,
                icon: pct>=70?'success':'info',
                confirmButtonColor: '#20a1a0',
                confirmButtonText: pct<100?'Xem lại bài':'Tuyệt vời!'
            });
        }
        function checkAllAnswers() { submitAll(); }


                // --- Router (Quản lý chuyển trang bằng URL Hash) ---
        // Giúp tạo ra các link duy nhất cho từng bài tập
        function handleRouting() {
            const hash = window.location.hash || '#/';
            
            // Ẩn tất cả view trước khi hiển thị view mới
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.body.classList.remove('has-exercise');
            document.getElementById('exov')?.remove();
            _exData = null;

            if (hash.startsWith('#/material/')) {
                // Route: Chi tiết tài liệu hoặc thư mục
                const path = hash.replace('#/material/', '');
                renderDetail(path);
                viewDetail.classList.add('active');
                
                // Hiển thị Navbar nếu là giáo viên, ẩn nếu là học sinh
                if (isLoggedIn) mainNav.classList.remove('hidden');
                else mainNav.classList.add('hidden'); 
            } 
            else if (hash === '#/dashboard') {
                // Route: Bảng điều khiển chọn tài liệu (Bắt buộc phải đăng nhập)
                if (!isLoggedIn) {
                    window.location.hash = '#/';
                    return;
                }
                renderDashboard();
                viewDashboard.classList.add('active');
                mainNav.classList.remove('hidden');
            } 
            else {
                // Route mặc định: Màn hình đăng nhập
                if (isLoggedIn) {
                    window.location.hash = '#/dashboard';
                    return;
                }
                viewLogin.classList.add('active');
                mainNav.classList.add('hidden');
            }
        }

        // --- Xử lý sự kiện Đăng nhập ---
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const codeInput = document.getElementById('teacher-code').value;
            
            if (codeInput === TEACHER_CODE) {
                isLoggedIn = true;
                sessionStorage.setItem('elm_teacher_logged_in', 'true');
                document.getElementById('teacher-code').value = '';
                
                Swal.fire({
                    title: 'Thành công!',
                    text: 'Chào mừng giáo viên đăng nhập.',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    confirmButtonColor: '#20a1a0'
                }).then(() => {
                    window.location.hash = '#/dashboard';
                });
            } else {
                Swal.fire({
                    title: 'Lỗi!',
                    text: 'Mã giáo viên không chính xác.',
                    icon: 'error',
                    confirmButtonColor: '#20a1a0'
                });
            }
        });

        // --- Xử lý sự kiện Đăng xuất ---
        document.getElementById('logout-btn').addEventListener('click', function() {
            Swal.fire({
                title: 'Đăng xuất?',
                text: 'Bạn có chắc chắn muốn thoát khỏi hệ thống?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#20a1a0',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'Đăng xuất',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    isLoggedIn = false;
                    sessionStorage.removeItem('elm_teacher_logged_in');
                    window.location.hash = '#/';
                }
            });
        });

        // --- Hàm Copy Link dành cho giáo viên để gửi cho học sinh ---
        function copyCurrentLink() {
            // Lấy URL hiện tại (bao gồm cả Hash chứa bài tập)
            const currentUrl = window.location.href;
            
            // Thử sử dụng Clipboard API hiện đại
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(currentUrl).then(showCopySuccess);
            } else {
                // Cách fallback cho các trình duyệt cũ hơn hoặc môi trường iframe
                let textArea = document.createElement("textarea");
                textArea.value = currentUrl;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopySuccess();
                } catch (err) {
                    Swal.fire('Lỗi', 'Không thể copy link tự động.', 'error');
                }
                textArea.remove();
            }
        }

        function showCopySuccess() {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });
            Toast.fire({
                icon: 'success',
                title: 'Đã copy link bài tập thành công!'
            });
        }
        
        // Mô phỏng nộp bài cho học sinh
        function submitQuiz() {
            Swal.fire({
                title: 'Nộp bài thành công!',
                text: 'Câu trả lời của bạn đã được ghi nhận.',
                icon: 'success',
                confirmButtonColor: '#20a1a0'
            });
        }

        // Lắng nghe sự kiện đổi URL (hash) để thay đổi view tương ứng
        window.addEventListener('hashchange', handleRouting);
        
        // Chạy hàm kiểm tra router lần đầu tiên khi vừa tải trang xong
        window.addEventListener('DOMContentLoaded', handleRouting);
        
    </script>
