<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Language Materials</title>

    <!-- Tailwind CSS cho thiết kế responsive và UI -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome cho icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 để thay thế alert() mặc định, tạo thông báo đẹp mắt -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Màu Blue Turtle nhẹ nhàng, thanh lịch
                        'turtle': {
                            50: '#f0fbfa',
                            100: '#ccf2ef',
                            200: '#99e4df',
                            300: '#66d3cc',
                            400: '#3fbcba',
                            500: '#20a1a0', // Main Blue Turtle color
                            600: '#178082',
                            700: '#136768',
                            800: '#115254',
                            900: '#0f4446',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(32, 161, 160, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Hiệu ứng nảy nhẹ khi hover cho các tương tác */
        .hover-bounce {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .hover-bounce:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(32, 161, 160, 0.2), 0 10px 10px -5px rgba(32, 161, 160, 0.1);
        }

        /* Ẩn hiện các view để tạo ứng dụng Single Page (SPA) */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .material-card .card-bg-decor { background-color: var(--theme-color); opacity: 0.1; }
        .material-card .card-icon { background-color: var(--theme-bg-color); color: var(--theme-color); }
        .material-card:hover .card-icon { background-color: var(--theme-color) !important; color: white !important; }
        .material-card:hover .card-title { color: var(--theme-color); }

        .detail-decor { background-color: var(--theme-color); opacity: 0.15; }
        .detail-icon { background-color: var(--theme-bg-color); color: var(--theme-color); }

        /* CSS riêng cho Giao diện Quiz Toàn màn hình */
        #view-quiz.active { display: flex !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col">

    <!-- Navbar chung (sẽ ẩn ở màn hình đăng nhập) -->
    <nav id="main-nav" class="bg-white shadow-sm px-6 py-4 hidden sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 text-turtle-600 font-bold text-xl cursor-pointer hover-bounce" onclick="window.location.hash='#/dashboard'">
                <div class="bg-turtle-100 p-2 rounded-xl text-turtle-600">
                    <i class="fa-solid fa-earth-americas"></i>
                </div>
                <span>ELM Portal</span>
            </div>
            <div>
                <button id="logout-btn" class="text-slate-500 hover:text-turtle-600 font-medium px-4 py-2 rounded-xl hover:bg-turtle-50 transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col p-4 sm:p-6 w-full max-w-6xl mx-auto">

        <!-- VIEW 1: ĐĂNG NHẬP -->
        <section id="view-login" class="view-section active m-auto w-full max-w-md">
            <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-soft text-center hover-bounce">
                <div class="w-20 h-20 bg-turtle-100 rounded-3xl flex items-center justify-center mx-auto mb-6 text-turtle-500 text-4xl shadow-sm rotate-3 hover:rotate-0 transition-transform">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">ENGLISH LANGUAGE MATERIALS</h1>
                <p class="text-slate-500 text-sm mb-8">Dành riêng cho giáo viên. Vui lòng nhập mã truy cập.</p>

                <form id="login-form" class="space-y-6">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="teacher-code" placeholder="Nhập mã giáo viên"
                            class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-turtle-400 focus:bg-white transition-all shadow-inner font-medium"
                            required>
                    </div>

                    <button type="submit"
                        class="w-full py-4 px-6 bg-turtle-500 text-white font-bold rounded-2xl hover:bg-turtle-600 active:scale-95 transition-all shadow-lg shadow-turtle-500/30 flex items-center justify-center gap-2">
                        <span>Truy cập hệ thống</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </section>

        <!-- VIEW 2: DANH SÁCH TÀI LIỆU (DASHBOARD) -->
        <section id="view-dashboard" class="view-section w-full py-6">
            <div class="mb-10 text-center sm:text-left">
                <h2 class="text-3xl font-bold text-slate-800 mb-3">Tài liệu Giảng dạy</h2>
                <p class="text-slate-500">Chọn một học phần để xem chi tiết và giao bài tập cho học sinh.</p>
            </div>

            <!-- Vùng chứa danh sách Grid -->
            <div id="materials-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Nội dung được render bằng JavaScript tự động -->
            </div>
        </section>

        <!-- VIEW 3: CHI TIẾT TÀI LIỆU (MÀN HÌNH BÀI TẬP CÓ LINK RIÊNG) -->
        <section id="view-detail" class="view-section w-full py-6 max-w-4xl mx-auto">

            <button id="back-btn" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-slate-800 transition-colors font-medium w-fit hover-bounce">
                <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
            </button>

            <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-soft relative overflow-hidden">
                <!-- Decoration background -->
                <div class="absolute -top-16 -right-16 w-32 h-32 rounded-full blur-2xl detail-decor transition-colors duration-500"></div>

                <div class="relative z-10 flex flex-col md:flex-row gap-8 items-start md:items-center justify-between mb-8 pb-8 border-b border-slate-100">
                    <div class="flex items-center gap-5">
                        <div>
                            <h2 id="detail-title" class="text-2xl sm:text-3xl font-bold text-slate-800">Tên bài học</h2>
                            <p id="detail-subtitle" class="font-medium mt-1" style="color: var(--theme-color);">Bài tập thực hành</p>
                        </div>
                    </div>

                    <!-- Nút Copy Link dành cho giáo viên (Học sinh sẽ không thấy nút này) -->
                    <div id="teacher-tools" class="w-full md:w-auto hidden">
                        <button onclick="copyCurrentLink()" title="Copy Link" class="w-12 h-12 bg-slate-50 hover:bg-slate-800 hover:text-white border border-slate-200 font-semibold rounded-2xl transition-all flex items-center justify-center text-xl shadow-sm hover-bounce ml-auto" style="color: var(--theme-color);">
                            <i class="fa-solid fa-link"></i>
                        </button>
                    </div>
                </div>

                <!-- Vùng chứa nội dung động (Thư mục con hoặc Bài tập) -->
                <div id="dynamic-content-container" class="relative z-10">
                    <!-- Rendered by JS tự động -->
                </div>
            </div>
        </section>

    </main>

    <!-- VIEW 4: GIAO DIỆN LÀM BÀI FULL SCREEN (ẨN MẶC ĐỊNH) -->
    <section id="view-quiz" class="view-section fixed inset-0 z-[100] bg-slate-50 flex-col overflow-hidden" style="display: none;">
        <!-- Quiz Header -->
        <header class="bg-white px-4 py-3 shadow-sm flex items-center justify-between shrink-0 z-10 relative">
            <div class="flex items-center gap-3">
                <button onclick="closeQuiz()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
                <h2 id="quiz-title" class="text-lg font-bold text-slate-800 hidden sm:block">Tên Bài Tập</h2>
            </div>

            <!-- Nhập thông tin học sinh -->
            <div class="flex items-center gap-2 sm:gap-4">
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" placeholder="Họ và tên" class="pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm w-32 sm:w-48 focus:outline-none focus:border-turtle-400 focus:bg-white transition-colors">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-school absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" placeholder="Lớp" class="pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm w-20 sm:w-28 focus:outline-none focus:border-turtle-400 focus:bg-white transition-colors">
                </div>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2 sm:h-3 shrink-0">
            <div id="quiz-progress" class="bg-turtle-500 h-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>

        <!-- Quiz Body (Side by Side trên máy tính 16:9, Stack trên điện thoại 9:16) -->
        <div class="flex-1 flex flex-col md:flex-row p-4 sm:p-6 lg:p-8 gap-4 sm:gap-6 overflow-hidden min-h-0 max-w-[1600px] mx-auto w-full">

            <!-- Cột trái: Nội dung Câu hỏi -->
            <div class="w-full md:w-5/12 lg:w-1/2 bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-10 flex flex-col justify-center items-center overflow-y-auto custom-scrollbar relative">
                <div class="absolute top-6 left-6 px-4 py-1.5 bg-slate-100 rounded-full text-slate-500 font-bold text-sm tracking-wide">
                    CÂU HỎI <span id="q-num" class="text-turtle-600 text-lg ml-1">1</span>
                </div>
                <p id="q-text" class="text-2xl sm:text-3xl lg:text-4xl font-bold text-slate-800 text-center leading-relaxed mt-10">
                    Loading question...
                </p>
            </div>

            <!-- Cột phải: Các đáp án & Giải thích -->
            <div class="w-full md:w-7/12 lg:w-1/2 flex flex-col gap-3 sm:gap-4 overflow-y-auto custom-scrollbar p-2" id="a-container">
                <!-- Nút đáp án được render bằng JS -->
            </div>
        </div>

        <!-- Footer: Navigator chọn câu hỏi nhỏ gọn -->
        <footer class="bg-white border-t border-slate-200 p-3 sm:p-5 shrink-0 shadow-[0_-10px_20px_rgba(0,0,0,0.04)] flex flex-col sm:flex-row items-center justify-between gap-4 z-10 relative">

            <!-- Bảng chọn câu hỏi -->
            <div id="quiz-navigator" class="flex flex-wrap gap-2 sm:gap-3 justify-center flex-1">
               <!-- Các nút số thứ tự câu hỏi sinh ra tự động -->
            </div>

            <!-- Nút Nộp bài -->
            <button id="btn-submit-quiz" onclick="submitQuizAction()" class="w-full sm:w-auto py-3 sm:py-4 px-8 sm:px-12 bg-turtle-500 text-white font-bold text-lg rounded-2xl hover:bg-turtle-600 active:scale-95 transition-all shadow-lg hover-bounce whitespace-nowrap">
                <i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài ngay
            </button>
        </footer>
    </section>

    <script>
        // --- Dữ liệu các cấp độ học (Materials) dựa trên yêu cầu ---
        const materialsData = [
            { id: 'pre-a1-starters', name: 'Pre-A1 Starters', description: 'Trình độ cơ bản nhất cho trẻ em mới bắt đầu.', color: '#F5A623', folders: [{ id: 'i-dictionary', name: 'I Dictionary' }] },
            { id: 'a1-movers', name: 'A1 Movers', description: 'Bước thứ hai trong hành trình học tiếng Anh.', color: '#A8C63B', folders: [
                { id: 'i-dictionary', name: 'I Dictionary' },
                { id: 'collins-for-movers', name: 'Collins for Movers', subfolders: [
                    { id: 'test-1', name: 'Test 1', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-2', name: 'Test 2', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-3', name: 'Test 3', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-4', name: 'Test 4', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-5', name: 'Test 5', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-6', name: 'Test 6', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-7', name: 'Test 7', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-8', name: 'Test 8', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-9', name: 'Test 9', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-10', name: 'Test 10', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-11', name: 'Test 11', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-12', name: 'Test 12', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] },
                    { id: 'test-13', name: 'Test 13', skills: [{id:'listening',name:'Listening'},{id:'reading',name:'Reading'}] }
                ]}
            ] },
            { id: 'a2-flyers', name: 'A2 Flyers', description: 'Cấp độ cao nhất trong hệ thống YLE cho trẻ.', color: '#21B6A8', folders: [{ id: 'i-dictionary', name: 'I Dictionary' }] },
            { id: 'a2-key', name: 'A2 Key', description: 'Chứng chỉ tiếng Anh tổng quát trình độ A2 (KET).', color: '#00AFA9' },
            { id: 'b1-preliminary', name: 'B1 Preliminary', description: 'Nắm vững các kiến thức cơ bản ngôn ngữ (PET).', color: '#009D98' },
            { id: 'b2-first', name: 'B2 First', description: 'Chứng minh đủ khả năng làm việc/học tập (FCE).', color: '#008F9C' },
            { id: 'c1-advanced', name: 'C1 Advanced', description: 'Chứng chỉ trình độ tiếng Anh cao cấp (CAE).', color: '#148DA8' }
        ];

        // Mật khẩu giáo viên cố định theo yêu cầu
        const TEACHER_CODE = '123';

        // Kiểm tra xem giáo viên đã đăng nhập từ trước chưa (Lưu session)
        let isLoggedIn = sessionStorage.getItem('elm_teacher_logged_in') === 'true';

        // Tham chiếu các phần tử DOM
        const viewLogin = document.getElementById('view-login');
        const viewDashboard = document.getElementById('view-dashboard');
        const viewDetail = document.getElementById('view-detail');
        const mainNav = document.getElementById('main-nav');

        // --- Render UI Dashboard (Danh sách khóa học) ---
        function renderDashboard() {
            const grid = document.getElementById('materials-grid');
            grid.innerHTML = '';

            materialsData.forEach(mat => {
                // Tạo mã màu bg với opacity
                const bgColorWithOpacity = mat.color + '25';

                // Thêm thuộc tính aspect-square và flex-col để tạo hình vuông bo góc, chữ căn giữa
                const cardHtml = `
                    <a href="#/material/${mat.id}" class="material-card aspect-square flex flex-col justify-center items-center text-center group block bg-white rounded-3xl p-6 border border-slate-100 hover-bounce cursor-pointer relative overflow-hidden shadow-sm" style="--theme-color: ${mat.color}; --theme-bg-color: ${bgColorWithOpacity};">
                        <div class="absolute -right-4 -top-4 w-24 h-24 rounded-full transition-transform group-hover:scale-150 z-0 duration-500 card-bg-decor"></div>
                        <div class="relative z-10 flex flex-col justify-center items-center h-full w-full">
                            <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mb-2 transition-colors duration-300 card-title">${mat.name}</h3>
                            <p class="text-slate-500 text-sm leading-relaxed">${mat.description}</p>
                        </div>
                    </a>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // --- Render UI Chi tiết Bài Học & Thư mục ---
        function renderDetail(pathString) {
            const pathParts = pathString.split('/');
            const materialId = pathParts[0];
            const folderId = pathParts[1];
            const subfolderId = pathParts[2];
            const skillId = pathParts[3];

            const material = materialsData.find(m => m.id === materialId);

            if (!material) {
                Swal.fire('Lỗi', 'Không tìm thấy tài liệu này!', 'error')
                    .then(() => window.location.hash = '#/dashboard');
                return;
            }

            const viewDetail = document.getElementById('view-detail');
            viewDetail.style.setProperty('--theme-color', material.color);
            viewDetail.style.setProperty('--theme-bg-color', material.color + '25');

            let titleText = material.name;
            let subtitleText = 'Danh sách thư mục';
            let isShowingQuiz = false;
            let quizFolderPath = '';

            const container = document.getElementById('dynamic-content-container');
            const backBtn = document.getElementById('back-btn');
            container.innerHTML = '';

            const folder = folderId ? (material.folders || []).find(f => f.id === folderId) : null;
            const subfolder = (folder && folder.subfolders) ? folder.subfolders.find(sf => sf.id === subfolderId) : null;

            // Xử lý nút Quay lại
            if (skillId && subfolderId) {
                backBtn.onclick = () => window.location.hash = `#/material/${materialId}/${folderId}/${subfolderId}`;
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Quay lại';
            } else if (subfolderId) {
                backBtn.onclick = () => window.location.hash = `#/material/${materialId}/${folderId}`;
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Quay lại';
            } else if (folderId) {
                backBtn.onclick = () => window.location.hash = `#/material/${materialId}`;
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Quay lại thư mục';
            } else {
                backBtn.onclick = () => window.location.hash = '#/dashboard';
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Quay lại danh sách';
            }

            // Level 4: skill (listening/reading) -> show quiz
            if (skillId && subfolder) {
                const skill = subfolder.skills ? subfolder.skills.find(s => s.id === skillId) : null;
                if (skill) {
                    titleText = `${folder.name} / ${subfolder.name} / ${skill.name}`;
                    subtitleText = 'Bài tập thực hành';
                    isShowingQuiz = true;
                    quizFolderPath = `${folderId}/${subfolderId}/${skillId}`;
                }
            }
            // Level 3: subfolder with skills -> show skills list
            else if (subfolderId && subfolder && subfolder.skills) {
                titleText = `${folder.name} / ${subfolder.name}`;
                subtitleText = 'Chọn kỹ năng';
                let html = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">';
                subfolder.skills.forEach(s => {
                    const icon = s.id === 'listening' ? 'fa-headphones' : 'fa-book-open';
                    html += `
                        <a href="#/material/${materialId}/${folderId}/${subfolderId}/${s.id}" class="aspect-square bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover-bounce flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group" style="background-color: var(--theme-bg-color);">
                            <i class="fa-solid ${icon} text-4xl mb-3 opacity-80" style="color: var(--theme-color);"></i>
                            <span class="relative z-10 text-lg sm:text-xl font-bold transition-transform group-hover:scale-105" style="color: var(--theme-color);">${s.name}</span>
                        </a>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
            // Level 2: folder with subfolders -> show subfolders
            else if (folderId && folder && folder.subfolders) {
                titleText = `${material.name} / ${folder.name}`;
                subtitleText = 'Chọn bài kiểm tra';
                let html = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">';
                folder.subfolders.forEach(sf => {
                    html += `
                        <a href="#/material/${materialId}/${folderId}/${sf.id}" class="aspect-square bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover-bounce flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group" style="background-color: var(--theme-bg-color);">
                            <i class="fa-solid fa-file-lines text-4xl mb-3 opacity-80" style="color: var(--theme-color);"></i>
                            <span class="relative z-10 text-lg sm:text-xl font-bold transition-transform group-hover:scale-105" style="color: var(--theme-color);">${sf.name}</span>
                        </a>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
            // Level 2: folder without subfolders -> show quiz directly
            else if (folderId && folder) {
                titleText = `${material.name} / ${folder.name}`;
                subtitleText = 'Bài tập thực hành';
                isShowingQuiz = true;
                quizFolderPath = folderId;
            }
            // Level 1: no folders -> show quiz
            else if (!material.folders || material.folders.length === 0) {
                subtitleText = 'Bài tập thực hành';
                isShowingQuiz = true;
                quizFolderPath = '';
            }
            // Level 1: show folder list
            else {
                let html = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">';
                material.folders.forEach(f => {
                    html += `
                        <a href="#/material/${material.id}/${f.id}" class="aspect-square bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover-bounce flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group" style="background-color: var(--theme-bg-color);">
                            <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-80" style="color: var(--theme-color);"></i>
                            <span class="relative z-10 text-lg sm:text-xl font-bold transition-transform group-hover:scale-105" style="color: var(--theme-color);">${f.name}</span>
                        </a>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }

            if (isShowingQuiz) {
                container.innerHTML = `
                    <div class="text-center py-12 px-4 bg-slate-50 rounded-3xl border border-slate-100 shadow-inner">
                        <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto mb-6 text-5xl shadow-sm hover-bounce" style="color: var(--theme-color);">
                            <i class="fa-solid fa-gamepad"></i>
                        </div>
                        <h3 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-3">Sẵn sàng làm bài?</h3>
                        <p class="text-slate-500 mb-8 max-w-md mx-auto">Bài tập được thiết kế giao diện toàn màn hình, giúp bạn tập trung tối đa và dễ dàng theo dõi tiến độ.</p>

                        <button onclick="openFullscreenQuiz('${titleText.replace(/'/g, "\\'")}', '${material.id}', '${quizFolderPath}')" class="py-4 px-10 text-white font-bold text-lg rounded-2xl hover:opacity-90 transition-all shadow-lg hover-bounce inline-flex items-center gap-3" style="background-color: var(--theme-color);">
                            <span>Bắt đầu làm bài ngay</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
            }

            document.getElementById('detail-title').innerText = titleText;
            document.getElementById('detail-subtitle').innerText = subtitleText;

            const teacherTools = document.getElementById('teacher-tools');

            if (isLoggedIn) {
                teacherTools.classList.remove('hidden');
                backBtn.style.display = 'flex';
            } else {
                teacherTools.classList.add('hidden');
                backBtn.style.display = 'none';
            }
        }

        // --- Router (Quản lý chuyển trang bằng URL Hash) ---
        // Giúp tạo ra các link duy nhất cho từng bài tập
        function handleRouting() {
            const hash = window.location.hash || '#/';

            // Ẩn tất cả view trước khi hiển thị view mới
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));

            if (hash.startsWith('#/material/')) {
                // Route: Chi tiết tài liệu hoặc thư mục
                const path = hash.replace('#/material/', '');
                renderDetail(path);
                viewDetail.classList.add('active');

                // Hiển thị Navbar nếu là giáo viên, ẩn nếu là học sinh
                if (isLoggedIn) mainNav.classList.remove('hidden');
                else mainNav.classList.add('hidden');
            }
            else if (hash === '#/dashboard') {
                // Route: Bảng điều khiển chọn tài liệu (Bắt buộc phải đăng nhập)
                if (!isLoggedIn) {
                    window.location.hash = '#/';
                    return;
                }
                renderDashboard();
                viewDashboard.classList.add('active');
                mainNav.classList.remove('hidden');
            }
            else {
                // Route mặc định: Màn hình đăng nhập
                if (isLoggedIn) {
                    window.location.hash = '#/dashboard';
                    return;
                }
                viewLogin.classList.add('active');
                mainNav.classList.add('hidden');
            }
        }

        // --- Xử lý sự kiện Đăng nhập ---
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const codeInput = document.getElementById('teacher-code').value;

            if (codeInput === TEACHER_CODE) {
                isLoggedIn = true;
                sessionStorage.setItem('elm_teacher_logged_in', 'true');
                document.getElementById('teacher-code').value = '';

                Swal.fire({
                    title: 'Thành công!',
                    text: 'Chào mừng giáo viên đăng nhập.',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    confirmButtonColor: '#20a1a0'
                }).then(() => {
                    window.location.hash = '#/dashboard';
                });
            } else {
                Swal.fire({
                    title: 'Lỗi!',
                    text: 'Mã giáo viên không chính xác.',
                    icon: 'error',
                    confirmButtonColor: '#20a1a0'
                });
            }
        });

        // --- Xử lý sự kiện Đăng xuất ---
        document.getElementById('logout-btn').addEventListener('click', function() {
            Swal.fire({
                title: 'Đăng xuất?',
                text: 'Bạn có chắc chắn muốn thoát khỏi hệ thống?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#20a1a0',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'Đăng xuất',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    isLoggedIn = false;
                    sessionStorage.removeItem('elm_teacher_logged_in');
                    window.location.hash = '#/';
                }
            });
        });

        // --- Hàm Copy Link dành cho giáo viên để gửi cho học sinh ---
        function copyCurrentLink() {
            // Lấy URL hiện tại (bao gồm cả Hash chứa bài tập)
            const currentUrl = window.location.href;

            // Thử sử dụng Clipboard API hiện đại
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(currentUrl).then(showCopySuccess);
            } else {
                // Cách fallback cho các trình duyệt cũ hơn hoặc môi trường iframe
                let textArea = document.createElement("textarea");
                textArea.value = currentUrl;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopySuccess();
                } catch (err) {
                    Swal.fire('Lỗi', 'Không thể copy link tự động.', 'error');
                }
                textArea.remove();
            }
        }

        function showCopySuccess() {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });
            Toast.fire({
                icon: 'success',
                title: 'Đã copy link bài tập thành công!'
            });
        }

        // --- LOGIC GIAO DIỆN LÀM BÀI FULL SCREEN (QUIZ) ---
        let currentQuizTheme = '#20a1a0';
        let quizData = [];
        let userAnswers = {};
        let activeQ = 0;
        let quizSubmitted = false;

        async function openFullscreenQuiz(title, materialId, folderId) {
            // Lấy màu chủ đạo của thư mục/tài liệu hiện tại
            currentQuizTheme = document.getElementById('view-detail').style.getPropertyValue('--theme-color') || '#20a1a0';

            // Xây dựng đường dẫn file JSON tương ứng với bài học
            // Cấu trúc: ./data/[mã_tài_liệu]_[mã_thư_mục].json (nếu có thư mục)
            let jsonFileName = materialId;
            if (folderId) {
                jsonFileName += `_${folderId}`;
            }
            const jsonPath = `./data/${jsonFileName}.json`;

            try {
                // Hiện popup đang tải dữ liệu
                Swal.fire({
                    title: 'Đang tải dữ liệu...',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                // Gọi fetch để lấy file JSON
                const response = await fetch(jsonPath);

                // Kiểm tra nếu file không tồn tại
                if (!response.ok) {
                    throw new Error('Nội dung không tồn tại (404)');
                }

                const data = await response.json();

                // Kiểm tra nếu file rỗng
                if (!data || data.length === 0) {
                    throw new Error('Dữ liệu rỗng');
                }

                // Nạp dữ liệu vào ứng dụng
                quizData = data;

                // Đóng popup tải dữ liệu
                Swal.close();

                // Reset trạng thái làm bài
                userAnswers = {};
                activeQ = 0;
                quizSubmitted = false;

                // Set thông tin giao diện
                document.getElementById('quiz-title').innerText = title;
                document.getElementById('quiz-progress').style.backgroundColor = currentQuizTheme;
                document.getElementById('btn-submit-quiz').style.backgroundColor = currentQuizTheme;

                // Chuyển đổi View: Ẩn tất cả, hiện View Quiz
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById('view-quiz').classList.add('active');

                // Ẩn thanh Nav bar chính để có trải nghiệm toàn màn hình trọn vẹn
                document.getElementById('main-nav').classList.add('hidden');

                renderQuizView();

            } catch (error) {
                console.warn("Chưa có dữ liệu bài tập: ", error.message);

                // Báo lỗi bằng SweetAlert nếu chưa có nội dung
                Swal.fire({
                    title: 'Thông báo',
                    text: 'Nội dung hiện tại chưa có sẵn.',
                    icon: 'info',
                    confirmButtonColor: currentQuizTheme
                });
            }
        }

        function renderQuizView() {
            const qData = quizData[activeQ];

            // 1. Cập nhật thanh Tiến độ (Progress Bar)
            const answeredCount = Object.keys(userAnswers).length;
            const progressPercent = quizSubmitted ? 100 : (answeredCount / quizData.length) * 100;
            const progressBar = document.getElementById('quiz-progress');
            progressBar.style.width = `${progressPercent}%`;
            if (quizSubmitted) progressBar.style.backgroundColor = '#22c55e'; // Xanh lá khi đã nộp
            else progressBar.style.backgroundColor = currentQuizTheme;

            // 2. Cập nhật Câu hỏi
            document.getElementById('q-num').innerText = (activeQ + 1);
            document.getElementById('q-num').style.color = currentQuizTheme;
            document.getElementById('q-text').innerText = qData.question;

            // 3. Render Các Nút Đáp Án
            const ansContainer = document.getElementById('a-container');
            ansContainer.innerHTML = ''; // Clear cũ

            qData.options.forEach((opt, idx) => {
                const isSelected = userAnswers[activeQ] === idx;
                const isCorrect = qData.correct === idx;

                let btnClass = "w-full p-5 sm:p-6 text-lg sm:text-xl rounded-2xl border-2 text-left transition-all font-medium flex items-center shadow-sm ";

                if (quizSubmitted) {
                    btnClass += "cursor-default ";
                    if (isCorrect) {
                        // Đáp án đúng -> Xanh lá
                        btnClass += "bg-green-50 border-green-500 text-green-700 font-bold z-10 relative scale-[1.02] shadow-md";
                    } else if (isSelected && !isCorrect) {
                        // Chọn sai -> Đỏ
                        btnClass += "bg-red-50 border-red-400 text-red-700 opacity-80";
                    } else {
                        // Không chọn và không đúng -> Mờ đi
                        btnClass += "bg-white border-slate-100 text-slate-400 opacity-50";
                    }
                } else {
                    btnClass += "cursor-pointer hover:-translate-y-1 hover:shadow-md ";
                    if (isSelected) {
                        btnClass += `bg-slate-50 text-slate-800 shadow-md ring-1 `;
                    } else {
                        btnClass += "bg-white border-slate-200 text-slate-600 hover:border-slate-300";
                    }
                }

                const btn = document.createElement('button');
                btn.className = btnClass;

                // Tô màu viền động theo theme nếu đang được chọn (lúc chưa nộp)
                if (isSelected && !quizSubmitted) {
                    btn.style.borderColor = currentQuizTheme;
                    btn.style.setProperty('--tw-ring-color', currentQuizTheme);
                }

                // Render Icon đánh dấu A, B, C, D hoặc icon Đúng/Sai
                let letters = ['A', 'B', 'C', 'D'];
                let iconHtml = `<div class="w-8 h-8 rounded-full border-2 border-slate-200 text-slate-400 flex items-center justify-center mr-4 shrink-0 font-bold text-sm bg-white">${letters[idx]}</div>`;

                if (quizSubmitted) {
                    if (isCorrect) {
                        iconHtml = `<div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center mr-4 shrink-0 shadow-sm"><i class="fa-solid fa-check"></i></div>`;
                    } else if (isSelected && !isCorrect) {
                        iconHtml = `<div class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center mr-4 shrink-0 shadow-sm"><i class="fa-solid fa-xmark"></i></div>`;
                    }
                } else if (isSelected) {
                    iconHtml = `<div class="w-8 h-8 rounded-full text-white flex items-center justify-center mr-4 shrink-0 shadow-sm font-bold text-sm" style="background-color: ${currentQuizTheme}; border-color: ${currentQuizTheme}">${letters[idx]}</div>`;
                }

                btn.innerHTML = `${iconHtml} <span class="flex-1">${opt}</span>`;

                if (!quizSubmitted) {
                    btn.onclick = () => selectAnswer(idx);
                }
                ansContainer.appendChild(btn);
            });

            // 4. Render Giải thích (Nếu đã nộp bài)
            if (quizSubmitted) {
                const exp = document.createElement('div');
                exp.className = "mt-4 p-5 sm:p-6 bg-blue-50 border border-blue-200 rounded-2xl text-blue-900 animate-[fadeIn_0.5s_ease-out] shadow-sm";
                exp.innerHTML = `<h4 class="font-bold flex items-center gap-2 mb-2 text-blue-700 text-lg"><i class="fa-solid fa-lightbulb text-yellow-500 text-xl"></i> Giải thích đáp án</h4><p class="leading-relaxed text-base">${qData.explanation}</p>`;
                ansContainer.appendChild(exp);
            }

            // 5. Cập nhật Bảng Câu Hỏi (Navigator ở Footer)
            const navContainer = document.getElementById('quiz-navigator');
            navContainer.innerHTML = '';

            quizData.forEach((_, idx) => {
                const isAnswered = userAnswers[idx] !== undefined;
                const isCurrent = activeQ === idx;

                const navBtn = document.createElement('button');
                // Chỉnh nút bấm navigator hình vuông bo góc, gọn gàng
                navBtn.className = "w-10 h-10 sm:w-12 sm:h-12 rounded-2xl font-bold flex items-center justify-center transition-all hover-bounce text-sm sm:text-base shadow-sm ";

                if (quizSubmitted) {
                    const isCorrect = quizData[idx].correct === userAnswers[idx];
                    if (isCorrect) {
                        navBtn.className += "bg-green-500 text-white border-b-4 border-green-700 ";
                    } else if (isAnswered) {
                        navBtn.className += "bg-red-500 text-white border-b-4 border-red-700 ";
                    } else {
                        navBtn.className += "bg-slate-200 text-slate-500 border-b-4 border-slate-300 ";
                    }
                } else {
                    if (isCurrent) {
                        navBtn.className += "text-white shadow-lg scale-110 -translate-y-1 border-b-4 ";
                        navBtn.style.backgroundColor = currentQuizTheme;
                        navBtn.style.borderColor = 'rgba(0,0,0,0.2)';
                    } else if (isAnswered) {
                        navBtn.className += "bg-slate-700 text-white border-b-4 border-slate-900 ";
                    } else {
                        navBtn.className += "bg-white border-2 border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50 ";
                    }
                }

                if (quizSubmitted && isCurrent) {
                    navBtn.classList.add('ring-4', 'ring-blue-300', 'scale-110', '-translate-y-1');
                }

                navBtn.innerText = idx + 1;
                navBtn.onclick = () => {
                    activeQ = idx;
                    renderQuizView();
                };
                navContainer.appendChild(navBtn);
            });

            // 6. Cập nhật nút Nộp bài / Thoát
            const btnSubmit = document.getElementById('btn-submit-quiz');
            if (quizSubmitted) {
                btnSubmit.innerHTML = '<i class="fa-solid fa-door-open mr-2"></i> Quay lại lớp';
                btnSubmit.onclick = closeQuiz;
                btnSubmit.style.backgroundColor = '#475569';
            } else {
                btnSubmit.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Nộp bài ngay';
                btnSubmit.onclick = submitQuizAction;
                btnSubmit.style.backgroundColor = currentQuizTheme;
            }
        }

        function selectAnswer(optIdx) {
            userAnswers[activeQ] = optIdx;

            // Tự động chuyển sang câu tiếp theo (có delay nhẹ để xem hiệu ứng click)
            let nextQ = activeQ + 1;
            if (nextQ < quizData.length && userAnswers[nextQ] === undefined) {
                setTimeout(() => {
                    activeQ = nextQ;
                    renderQuizView();
                }, 300);
            }

            // Render lại ngay để tô màu đáp án
            renderQuizView();
        }

        function submitQuizAction() {
            const answeredCount = Object.keys(userAnswers).length;

            if (answeredCount < quizData.length) {
                Swal.fire({
                    title: 'Khoan đã!',
                    html: `Bạn còn <b>${quizData.length - answeredCount} câu hỏi</b> chưa trả lời.<br>Bạn có chắc chắn muốn nộp bài lúc này?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: currentQuizTheme,
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Nộp luôn',
                    cancelButtonText: 'Làm tiếp'
                }).then((result) => {
                    if (result.isConfirmed) calculateScore();
                });
            } else {
                Swal.fire({
                    title: 'Xác nhận nộp bài',
                    text: "Bạn đã hoàn thành tất cả câu hỏi. Nộp bài nhé?",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: currentQuizTheme,
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Đồng ý nộp',
                    cancelButtonText: 'Kiểm tra lại'
                }).then((result) => {
                    if (result.isConfirmed) calculateScore();
                });
            }
        }

        function calculateScore() {
            let score = 0;
            quizData.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) score += 1;
            });

            quizSubmitted = true;

            Swal.fire({
                title: 'Nộp bài thành công!',
                html: `
                    <div class="py-4">
                        <p class="text-slate-500 mb-2">Điểm số của bạn:</p>
                        <div class="text-5xl font-bold" style="color: ${currentQuizTheme}">${score} / ${quizData.length}</div>
                        <p class="mt-4 text-sm text-slate-600">Tuyệt vời! Hãy xem lại đáp án đúng và lời giải thích nhé.</p>
                    </div>
                `,
                icon: 'success',
                confirmButtonColor: currentQuizTheme,
                confirmButtonText: 'Xem giải thích chi tiết'
            }).then(() => {
                activeQ = 0; // Quay về câu 1
                renderQuizView();
            });
        }

        function closeQuiz() {
            if (!quizSubmitted) {
                Swal.fire({
                    title: 'Thoát bài tập?',
                    text: "Tiến độ làm bài của bạn sẽ không được lưu lại.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'Thoát',
                    cancelButtonText: 'Ở lại'
                }).then((result) => {
                    if (result.isConfirmed) executeCloseQuiz();
                });
            } else {
                executeCloseQuiz();
            }
        }

        function executeCloseQuiz() {
            document.getElementById('view-quiz').classList.remove('active');
            document.getElementById('view-detail').classList.add('active');
            if (isLoggedIn) document.getElementById('main-nav').classList.remove('hidden');
        }

        // Lắng nghe sự kiện đổi URL (hash) để thay đổi view tương ứng
        window.addEventListener('hashchange', handleRouting);

        // Chạy hàm kiểm tra router lần đầu tiên khi vừa tải trang xong
        window.addEventListener('DOMContentLoaded', handleRouting);

    </script>
</body>
